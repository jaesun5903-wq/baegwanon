<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>누수제로</title>
<meta name="description" content="소규모 배관 설비 업체용 접수·견적·배정·정산 관리. 추가 작업 승인 누락, 자재 중복 예약, 작업팀 일정 충돌, 청구 누락을 자동으로 찾아냅니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: PC는 왼쪽 레일 + 본문, 폰은 상단 바 + 본문 + 하단 탭. 작업 단계는 '배관' 띠로 표시 */
:root {
  --paper: #edf1f2;
  --surface: #ffffff;
  --surface-2: #f5f8f9;
  --ink: #15252c;
  --ink-2: #455860;
  --ink-3: #74868d;
  --rule: #d0dadd;
  --rule-2: #e3e9eb;
  --water: #1b6ea7;
  --water-ink: #ffffff;
  --water-soft: #dbeaf4;
  --brass: #a6802a;
  --brass-soft: #f2e8cf;
  --pipe: #c5cfd3;
  --pipe-hi: #dde4e7;
  --crit: #bf3329;
  --crit-soft: #fbe2df;
  --warn: #ad5d08;
  --warn-soft: #fbecd5;
  --ok: #2b764b;
  --ok-soft: #ddefe3;
  --scrim: rgba(17, 30, 36, 0.48);
  --sig-paper: #ffffff;
  --sig-ink: #15252c;
  --display: 'Do Hyeon', 'IBM Plex Sans KR', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --body: 'IBM Plex Sans KR', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --r: 10px;
  --r-s: 7px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --paper: #0e181c;
    --surface: #152228;
    --surface-2: #1a2a31;
    --ink: #e1eaed;
    --ink-2: #a2b3b9;
    --ink-3: #72868d;
    --rule: #2b3d45;
    --rule-2: #213239;
    --water: #55a6de;
    --water-ink: #06141c;
    --water-soft: #173549;
    --brass: #d1ae57;
    --brass-soft: #3a311b;
    --pipe: #34474f;
    --pipe-hi: #43585f;
    --crit: #f06a60;
    --crit-soft: #3c1d1a;
    --warn: #e8a24f;
    --warn-soft: #3a2a14;
    --ok: #5dc58b;
    --ok-soft: #163424;
    --scrim: rgba(0, 0, 0, 0.62);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --paper: #0e181c;
  --surface: #152228;
  --surface-2: #1a2a31;
  --ink: #e1eaed;
  --ink-2: #a2b3b9;
  --ink-3: #72868d;
  --rule: #2b3d45;
  --rule-2: #213239;
  --water: #55a6de;
  --water-ink: #06141c;
  --water-soft: #173549;
  --brass: #d1ae57;
  --brass-soft: #3a311b;
  --pipe: #34474f;
  --pipe-hi: #43585f;
  --crit: #f06a60;
  --crit-soft: #3c1d1a;
  --warn: #e8a24f;
  --warn-soft: #3a2a14;
  --ok: #5dc58b;
  --ok-soft: #163424;
  --scrim: rgba(0, 0, 0, 0.62);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 14.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body.locked { overflow: hidden; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
a { color: var(--water); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }
.num, .tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ───────── 뼈대 ───────── */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; gap: 22px; padding: 22px 14px 18px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--water); color: var(--water-ink); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 20px; height: 20px; fill: currentColor; stroke: none; }
.brand-name { font-family: var(--display); font-size: 25px; line-height: 1; letter-spacing: 0.01em; }
.brand-co { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px;
  color: var(--ink-2); font-weight: 500; text-decoration: none;
}
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current='page'] { background: var(--water-soft); color: var(--ink); font-weight: 600; }
.nav a[aria-current='page'] svg { color: var(--water); }
.nav .badge { margin-left: auto; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px 8px 0; border-top: 1px solid var(--rule-2); font-size: 12.5px; color: var(--ink-3); }
.side-foot .today { color: var(--ink); font-weight: 600; font-size: 13.5px; }
.side-foot .links { display: flex; flex-wrap: wrap; gap: 6px; }

.badge { display: inline-grid; place-items: center; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--crit); color: #fff; font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.badge.warn { background: var(--warn); }

.mtop, .tabbar { display: none; }
.main { min-width: 0; padding-block: 26px 48px; padding-inline: 32px; max-width: 1280px; width: 100%; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .mtop {
    display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--surface); border-bottom: 1px solid var(--rule); padding: 10px 16px;
  }
  .mtop .brand { padding: 0; }
  .mtop .brand-mark { width: 28px; height: 28px; border-radius: 8px; }
  .mtop .brand-name { font-size: 21px; }
  .mtop .grow { flex: 1; }
  .main { padding-inline: 16px; padding-block: 18px calc(92px + env(safe-area-inset-bottom, 0px)); }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--surface); border-top: 1px solid var(--rule); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; color: var(--ink-3); font-size: 11.5px; font-weight: 600; text-decoration: none; position: relative; }
  .tabbar a[aria-current='page'] { color: var(--water); }
  .tabbar svg.i { width: 22px; height: 22px; }
  .tabbar .badge { position: absolute; top: 0; left: calc(50% + 6px); min-width: 18px; height: 17px; font-size: 10.5px; }
}

/* ───────── 공통 요소 ───────── */
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 20px; }
.ph h1 { font-family: var(--display); font-weight: 400; font-size: 31px; line-height: 1.15; letter-spacing: 0.005em; }
.ph p { color: var(--ink-2); margin-top: 4px; }
.ph-act { display: flex; flex-wrap: wrap; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 1080px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); min-width: 0; }
.panel-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 14px 18px 0; }
.panel-h h2 { font-size: 16px; font-weight: 700; }
.panel-h .aside { color: var(--ink-3); font-size: 13px; }
.panel-b { padding: 14px 18px 18px; }
.panel-b.flush { padding: 8px 0 4px; }
.empty { padding: 18px; color: var(--ink-3); text-align: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; min-height: 38px;
  border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.primary:hover { opacity: 0.92; }
.btn.water { background: var(--water); border-color: var(--water); color: var(--water-ink); }
.btn.crit { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { min-height: 32px; padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.ic { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.ic:hover { background: var(--surface-2); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--rule-2); }
.pill.crit { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.water { background: var(--water-soft); color: var(--water); border-color: transparent; }
.pill.brass { background: var(--brass-soft); color: var(--brass); border-color: transparent; }
.code { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }

.drop { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.drop svg { width: 15px; height: 15px; fill: currentColor; stroke: none; }
.drop.crit { color: var(--crit); }
.drop.warn { color: var(--warn); }
.drop.info { color: var(--water); }

/* ───────── 배관 단계 띠 ───────── */
.pipe { --v: 38px; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.pipe li { position: relative; display: flex; flex-direction: column; align-items: center; gap: 7px; text-align: center; min-width: 0; }
.pipe li::before {
  content: ''; position: absolute; top: calc(var(--v) / 2 - 5px); right: 50%; width: 100%; height: 10px;
  background: linear-gradient(var(--pipe-hi), var(--pipe) 60%); z-index: 0;
}
.pipe li:first-child::before { display: none; }
.pipe li.flow::before { background: var(--water); }
.valve {
  position: relative; z-index: 1; width: var(--v); height: var(--v); border-radius: 50%;
  background: var(--surface); border: 3px solid var(--brass); color: var(--ink);
  display: grid; place-items: center; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;
}
.valve svg { width: 17px; height: 17px; stroke-width: 2.6; }
.pipe .done .valve { background: var(--water); border-color: var(--water); color: var(--water-ink); }
.pipe .cur .valve { border-color: var(--water); background: var(--water-soft); box-shadow: 0 0 0 5px var(--water-soft); }
.pipe .cur .valve::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--water); }
.pipe .lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); line-height: 1.25; overflow-wrap: anywhere; }
.pipe .cur .lbl { color: var(--ink); }
.pipe .lbl-s { display: none; }
.pipe .sub { font-size: 11.5px; color: var(--ink-3); margin-top: -4px; }
/* 개수 모드 (홈·목록 필터) */
.pipe.count button.joint { all: unset; display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer; min-width: 0; border-radius: 10px; padding: 0 2px 4px; }
.pipe.count button.joint:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }
.pipe.count .zero .valve { border-color: var(--pipe); color: var(--ink-3); font-weight: 500; }
.pipe.count .sel .valve { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.pipe.count .sel .lbl { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.pipe.count li.flow::before { background: linear-gradient(var(--pipe-hi), var(--pipe) 60%); }
@media (max-width: 600px) {
  .pipe { --v: 32px; }
  .pipe .lbl-l { display: none; }
  .pipe .lbl-s { display: inline; }
  .pipe .lbl { font-size: 12px; }
  .valve { font-size: 13px; border-width: 2.5px; }
}

.mini { display: inline-flex; gap: 2px; vertical-align: middle; }
.mini i { width: 9px; height: 5px; border-radius: 2px; background: var(--pipe); }
.mini i.on { background: var(--water); }

/* ───────── 홈 ───────── */
.leak { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.leak-money { padding: 18px 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; border-right: 1px solid var(--rule-2); }
.money .v { font-family: var(--display); font-size: 29px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.money .v small { font-family: var(--body); font-size: 14px; font-weight: 600; margin-left: 2px; }
.money .k { font-size: 13px; color: var(--ink-2); font-weight: 600; margin-top: 4px; }
.money .h { font-size: 12px; color: var(--ink-3); }
.money.crit .v { color: var(--crit); }
.money.warn .v { color: var(--warn); }
.leak-cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.leak-cats button {
  all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 14px 18px;
  border-left: 1px solid var(--rule-2); border-bottom: 1px solid var(--rule-2);
}
.leak-cats button:nth-child(odd) { border-left: 0; }
.leak-cats button:nth-last-child(-n + 2) { border-bottom: 0; }
.leak-cats button:hover { background: var(--surface-2); }
.leak-cats button:focus-visible { outline: 2px solid var(--water); outline-offset: -2px; }
.leak-cats .n { font-family: var(--display); font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.leak-cats .n.zero { color: var(--ink-3); }
.leak-cats .lb { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.leak-cats .sv { display: flex; gap: 8px; }
.leak-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--rule-2); flex-wrap: wrap; }
.leak-head h2 { font-size: 16px; display: flex; align-items: center; gap: 8px; }
.leak-head h2 svg { width: 18px; height: 18px; fill: var(--water); stroke: none; }
@media (max-width: 760px) {
  .leak { grid-template-columns: minmax(0, 1fr); }
  .leak-money { border-right: 0; border-bottom: 1px solid var(--rule-2); grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 16px; gap: 10px; }
  .money .v { font-size: 22px; }
  .money .v small { font-size: 12px; }
  .money .k { font-size: 12px; }
  .money .h { display: none; }
  .leak-cats button { padding: 12px 16px; }
}

.agenda { display: flex; flex-direction: column; }
.agenda-crew { padding: 10px 18px 12px; border-top: 1px solid var(--rule-2); }
.agenda-crew:first-child { border-top: 0; }
.agenda-crew h3 { font-size: 13px; color: var(--ink-2); font-weight: 700; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.slot { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; }
.slot + .slot { margin-top: 4px; }
.slot:hover { background: var(--surface-2); text-decoration: none; }
.slot .t { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13.5px; }
.slot .w { min-width: 0; }
.slot .w b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .w span { font-size: 12.5px; color: var(--ink-3); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot.conflict { background: var(--crit-soft); }
.slot.tight { background: var(--warn-soft); }

/* ───────── 경고 목록 ───────── */
.fd { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 18px; border-top: 1px solid var(--rule-2); align-items: start; }
.fd:first-child { border-top: 0; }
.fd .dr { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.fd .dr svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }
.fd.critical .dr { background: var(--crit-soft); color: var(--crit); }
.fd.warning .dr { background: var(--warn-soft); color: var(--warn); }
.fd .tt { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.fd .tt b { font-weight: 700; }
.fd .rc { font-size: 11.5px; font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.fd .dt { color: var(--ink-2); margin-top: 3px; font-size: 13.5px; overflow-wrap: anywhere; }
.fd .jl { margin-top: 5px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.fd .amt { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fd .amt small { display: block; font-weight: 500; font-size: 11.5px; color: var(--ink-3); }
.fd .act { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.fd.compact { padding: 11px 16px; }
.fd.compact .act { display: none; }
.fd.acked { opacity: 0.75; }
@media (max-width: 560px) {
  .fd { grid-template-columns: 30px minmax(0, 1fr); padding: 14px 16px; }
  .fd .amt { grid-column: 2; text-align: left; display: flex; gap: 8px; align-items: baseline; }
  .fd .amt small { display: inline; }
  .fd .amt:empty { display: none; }
  .now .fd { padding: 11px 12px; }
}
.fd.acked .dr { background: var(--surface-2); color: var(--ink-3); }

.cat-tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
.cat-tabs button {
  all: unset; box-sizing: border-box; cursor: pointer; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--rule);
  display: flex; flex-direction: column; gap: 4px; min-width: 0;
}
.cat-tabs button:hover { border-color: var(--ink-3); }
.cat-tabs button:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }
.cat-tabs button[aria-pressed='true'] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.cat-tabs .n { font-family: var(--display); font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.cat-tabs .lb { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.cat-tabs .sv { display: flex; gap: 8px; min-height: 18px; }
@media (max-width: 900px) {
  .cat-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cat-tabs button:first-child { grid-column: 1 / -1; }
}
.money-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-bottom: 16px; }
.money-row .money { padding: 14px 18px; border-left: 1px solid var(--rule-2); }
.money-row .money:first-child { border-left: 0; }
@media (max-width: 600px) {
  .money-row .money { padding: 12px; }
  .money-row .money .v { font-size: 21px; }
  .money-row .h { display: none; }
}

<script>
/* 누수제로 엔진 — 화면과 무관한 순수 로직 (브라우저·Node 공용)
 * 상태 전이(문의 → 현장 확인 → 견적 → 승인 → 배정 → 자재·시공 → 완료 정산),
 * 금액 계산, 그리고 4대 누수 지점 탐지 규칙을 담는다. */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.NusuEngine = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ───────────── 기본 정의 ───────────── */
  const STAGES = [
    { key: 'inquiry', label: '문의 접수', short: '접수', next: '현장 확인 일정을 잡으세요' },
    { key: 'survey', label: '현장 확인', short: '현장', next: '방문 후 현장 확인 결과를 기록하세요' },
    { key: 'quote', label: '견적', short: '견적', next: '견적을 작성해 고객에게 보내세요' },
    { key: 'approval', label: '고객 승인', short: '승인', next: '고객 승인을 받으세요' },
    { key: 'schedule', label: '작업 배정', short: '배정', next: '작업팀과 일정을 배정하세요' },
    { key: 'work', label: '자재 사용·시공', short: '시공', next: '자재 사용과 추가 작업을 기록하고 완료 처리하세요' },
    { key: 'settle', label: '완료 정산', short: '정산', next: '청구서를 발행하고 수금을 기록하세요' },
  ];
  const STAGE_INDEX = Object.fromEntries(STAGES.map((s, i) => [s.key, i]));

  const CATS = {
    approval: { label: '추가 작업 승인 누락', short: '승인 누락' },
    material: { label: '자재 중복 예약', short: '자재 중복' },
    schedule: { label: '작업팀 일정 충돌', short: '일정 충돌' },
    billing: { label: '청구 누락', short: '청구 누락' },
  };
  const CAT_ORDER = ['approval', 'material', 'schedule', 'billing'];

  const RULES = {
    A1: { cat: 'approval', name: '승인 없이 시공한 추가 작업', when: '추가 작업을 시공했다고 기록했는데 고객 승인(서명·문자·전화) 기록이 없다', sev: '항상 심각' },
    A2: { cat: 'approval', name: '견적을 넘는 자재 사용', when: '자재 사용량이 견적 수량과 추가 작업 수량의 합보다 많다 (추가 작업 미등록)', sev: '항상 심각' },
    A3: { cat: 'approval', name: '결정 안 된 추가 작업이 남은 채 완료', when: '완료 정산 단계인데 승인도 거절도 안 된 추가 작업이 있다', sev: '주의' },
    M1: { cat: 'material', name: '재고를 넘는 중복 예약', when: '같은 자재의 활성 예약 합계가 현재 재고보다 많다 (작업일이 빠른 예약부터 재고를 배분, 뒤 순번이 부족)', sev: '작업일 2일 이내 심각, 그 밖은 주의' },
    M2: { cat: 'material', name: '같은 작업의 이중 예약', when: '한 작업에 같은 자재 예약이 2건 이상 걸려 있다 (이중 입력 의심)', sev: '주의' },
    C1: { cat: 'schedule', name: '작업팀 일정 겹침', when: '같은 팀이 같은 날 시간대가 겹치는 일정 2건 이상 (현장 확인 방문 포함, 오늘 이후)', sev: '항상 심각' },
    C2: { cat: 'schedule', name: '이동 시간 부족', when: '같은 팀의 연속 일정 사이 간격이 이동 기준(기본 30분)보다 짧고 주소가 다르다', sev: '주의' },
    B1: { cat: 'billing', name: '완료 후 청구서 미발행', when: '작업 완료 후 1일 이상 청구서를 발행하지 않았다', sev: '7일 이상 심각, 1일 이상 주의' },
    B2: { cat: 'billing', name: '청구서에서 빠진 항목', when: '견적 항목이나 승인된 추가 작업이 청구서에 들어가지 않았다', sev: '항상 심각' },
    B3: { cat: 'billing', name: '사용 자재 미청구', when: '사용한 자재 수량이 청구서 수량보다 많다 (B2로 이미 잡힌 수량은 제외)', sev: '주의' },
    B4: { cat: 'billing', name: '수금 기한 경과', when: '청구서 지급 기한이 지났는데 잔액이 남아 있다', sev: '15일 이상 심각, 그 밖은 주의' },
    B5: { cat: 'billing', name: '작업일 경과 후 완료 미처리', when: '마지막 작업일이 지났는데 아직 시공 단계다 (청구 지연)', sev: '주의' },
  };
  const SEV_ORDER = { critical: 0, warning: 1, info: 2 };
  const SEV_LABEL = { critical: '심각', warning: '주의', info: '참고' };
  const APPROVAL_METHODS = ['서명', '문자', '전화'];

  class ActionError extends Error {
    constructor(code, message, data) {
      super(message);
      this.name = 'ActionError';
      this.code = code;
      this.data = data || null;
    }
  }

  /* ───────────── 날짜·숫자 유틸 ───────────── */
  const pad = (n) => String(n).padStart(2, '0');
  function parseDate(ds) {
    const [y, m, d] = ds.split('-').map(Number);
    return Date.UTC(y, m - 1, d);
  }
  function addDays(ds, n) {
    const t = new Date(parseDate(ds) + n * 86400000);
    return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate());
  }
  const diffDays = (a, b) => Math.round((parseDate(a) - parseDate(b)) / 86400000);
  const dow = (ds) => new Date(parseDate(ds)).getUTCDay();
  const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  function md(ds) {
    const [, m, d] = ds.split('-').map(Number);
    return `${m}/${d}(${WEEK[dow(ds)]})`;
  }
  function toMin(hm) {
    const [h, m] = String(hm).split(':').map(Number);
    return h * 60 + m;
  }
  const isTime = (hm) => /^\d{2}:\d{2}$/.test(String(hm || ''));
  const isDate = (ds) => /^\d{4}-\d{2}-\d{2}$/.test(String(ds || ''));
  const r2 = (n) => Math.round(n * 100) / 100;
  const fq = (n) => String(r2(n));
  const won = (n) => Math.round(n).toLocaleString('ko-KR') + '원';
  const clone = (o) => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
  const byId = (arr, id) => arr.find((x) => x.id === id);
  const idNum = (id) => parseInt(String(id).replace(/\D/g, ''), 10) || 0;

  /* ───────────── 금액 ───────────── */
  const lineAmount = (l) => Math.round(Number(l.qty) * Number(l.unitPrice));
  function totals(lines) {
    const supply = lines.reduce((a, l) => a + lineAmount(l), 0);
    const vat = Math.floor(supply * 0.1); // 부가세 원 미만 절사
    return { supply, vat, total: supply + vat };
  }
  const withVat = (supply) => supply + Math.floor(supply * 0.1);

  /* ───────────── 상태 생성 ───────────── */
  function emptyState() {
    return {
      version: 1,
      seq: 0,
      jobCounter: 0,
      company: { name: '우리 설비' },
      settings: { travelMin: 30, paymentTermDays: 14 },
      crews: [],
      materials: [],
      catalog: [],
      customers: [],
      jobs: [],
      reservations: [],
      stockLog: [],
      acks: {},
    };
  }

  function nextId(s, prefix) {
    s.seq = (s.seq || 0) + 1;
    return prefix + s.seq;
  }

  function starterState() {
    const s = emptyState();
    s.company = { name: '바른배관설비' };
    s.crews = [
      { id: 'c1', name: '1팀', lead: '김정호', members: ['김정호', '이민수'] },
      { id: 'c2', name: '2팀', lead: '박성우', members: ['박성우', '최윤재'] },
      { id: 'c3', name: '대표 방문', lead: '오세훈', members: ['오세훈'] },
    ];
    s.materials = [
      { id: 'm1', name: '엑셀파이프 XL 15A', unit: 'm', stock: 60, price: 3500 },
      { id: 'm2', name: 'PB 파이프 15A', unit: 'm', stock: 40, price: 2800 },
      { id: 'm3', name: '동관 15A (L형)', unit: 'm', stock: 12, price: 9800 },
      { id: 'm4', name: 'PVC 배수관 50A', unit: 'm', stock: 12, price: 6500 },
      { id: 'm5', name: 'PVC 배수관 100A', unit: 'm', stock: 10, price: 12000 },
      { id: 'm6', name: '볼밸브 15A', unit: '개', stock: 10, price: 8500 },
      { id: 'm7', name: '싱크 수전 (원홀)', unit: '개', stock: 3, price: 85000 },
      { id: 'm8', name: '양변기 (원피스)', unit: '개', stock: 1, price: 280000 },
      { id: 'm9', name: '난방 분배기 6구', unit: '개', stock: 1, price: 230000 },
      { id: 'm10', name: '배관 보온재 15A', unit: 'm', stock: 30, price: 1800 },
      { id: 'm11', name: '테프론·실리콘 소모품', unit: '세트', stock: 20, price: 5000 },
      { id: 'm12', name: 'P트랩 50A', unit: '개', stock: 4, price: 15000 },
    ];
    s.catalog = [
      { id: 's1', name: '출장·점검비', unit: '회', price: 30000 },
      { id: 's2', name: '누수 탐지 (장비)', unit: '회', price: 150000 },
      { id: 's3', name: '배관 교체 공임', unit: '인·일', price: 250000 },
      { id: 's4', name: '변기 교체 공임', unit: '식', price: 80000 },
      { id: 's5', name: '수전 교체 공임', unit: '식', price: 40000 },
      { id: 's6', name: '배수관 고압세척', unit: '회', price: 120000 },
      { id: 's7', name: '분배기 교체 공임', unit: '식', price: 180000 },
      { id: 's8', name: '바닥 철거·복구', unit: '식', price: 200000 },
      { id: 's9', name: '보온재 시공 공임', unit: '식', price: 40000 },
    ];
    s.seq = 100;
    return s;
  }

  function newJobRecord(s, o) {
    return Object.assign(
      {
        id: null,
        code: '',
        title: '',
        customerId: null,
        address: '',
        channel: '전화',
        issue: '',
        createdAt: '',
        stage: 'inquiry',
        status: 'open',
        survey: null,
        quote: { items: [], sentAt: null, sentVia: null },
        approval: null,
        assignments: [],
        usage: [],
        changeOrders: [],
        completedAt: null,
        completionNote: '',
        invoice: null,
        closedAt: null,
        canceledReason: '',
        history: [],
      },
      o
    );
  }

  function jobCode(s, date) {
    s.jobCounter = (s.jobCounter || 0) + 1;
    return date.slice(2, 4) + date.slice(5, 7) + '-' + String(s.jobCounter).padStart(3, '0');
  }

  /* ───────────── 조회 ───────────── */
  function expectedLines(job) {
    const out = [];
    for (const it of job.quote.items) out.push(lineFrom(it, 'quote', 'Q:' + it.id, null));
    for (const co of job.changeOrders) {
      if (co.status !== 'approved') continue;
      for (const it of co.items) out.push(lineFrom(it, 'co', 'C:' + co.id + ':' + it.id, co.id));
    }
    return out;
  }
  function lineFrom(it, source, key, coId) {
    return { key, source, coId, kind: it.kind, name: it.name, materialId: it.materialId || null, qty: it.qty, unit: it.unit, unitPrice: it.unitPrice };
  }
  function quoteTotals(job) {
    return totals(job.quote.items);
  }
  function expectedTotal(job) {
    return totals(expectedLines(job)).total;
  }
  function invoiceTotals(job) {
    if (!job.invoice) return null;
    const t = totals(job.invoice.lines);
    const paid = job.invoice.payments.reduce((a, p) => a + p.amount, 0);
    return Object.assign(t, { paid, balance: t.total - paid });
  }
  function sumBy(lines, pred) {
    const m = {};
    for (const l of lines) {
      if (!l.materialId || (pred && !pred(l))) continue;
      m[l.materialId] = r2((m[l.materialId] || 0) + Number(l.qty));
    }
    return m;
  }
  const usedBy = (job) => sumBy(job.usage);
  function allowedBy(job) {
    const lines = job.quote.items.slice();
    for (const co of job.changeOrders) if (co.status !== 'rejected') lines.push(...co.items);
    return sumBy(lines);
  }
  /** 견적·승인된 추가 작업 범위를 넘어 사용한 자재 (청구서 후보) */
  function unquotedUsage(state, job) {
    const used = usedBy(job);
    const covered = sumBy(expectedLines(job));
    const out = [];
    for (const mid of Object.keys(used)) {
      const ex = r2(used[mid] - (covered[mid] || 0));
      if (ex > 0) {
        const m = byId(state.materials, mid);
        out.push({ materialId: mid, qty: ex, name: m.name, unit: m.unit, unitPrice: m.price });
      }
    }
    return out;
  }

  function scheduleEntries(state) {
    const out = [];
    for (const job of state.jobs) {
      if (job.status === 'canceled') continue;
      const sv = job.survey;
      if (sv && sv.crewId && sv.date && sv.start) {
        out.push({ id: 'S:' + job.id, kind: 'survey', jobId: job.id, crewId: sv.crewId, date: sv.date, start: sv.start, end: sv.end, address: job.address, title: job.title });
      }
      for (const a of job.assignments) {
        out.push({ id: a.id, kind: 'work', jobId: job.id, crewId: a.crewId, date: a.date, start: a.start, end: a.end, address: job.address, title: job.title });
      }
    }
    return out;
  }
  const overlaps = (a, b) => toMin(a.start) < toMin(b.end) && toMin(b.start) < toMin(a.end);

  /** 새 일정(slot)이 기존 일정과 겹치는지, 이동 시간이 모자란지 미리 본다 */
  function checkSlot(state, slot, excludeId) {
    const travel = state.settings.travelMin;
    const same = scheduleEntries(state).filter((e) => e.crewId === slot.crewId && e.date === slot.date && e.id !== excludeId && byId(state.jobs, e.jobId).status === 'open');
    const conflicts = same.filter((e) => overlaps(e, slot));
    const tight = [];
    for (const e of same) {
      if (overlaps(e, slot) || e.address === slot.address) continue;
      const gap = toMin(slot.start) >= toMin(e.end) ? toMin(slot.start) - toMin(e.end) : toMin(e.start) - toMin(slot.end);
      if (gap >= 0 && gap < travel) tight.push(Object.assign({ gap }, e));
    }
    return { conflicts, tight };
  }

  function cmpRes(a, b) {
    return a.date < b.date ? -1 : a.date > b.date ? 1 : idNum(a.id) - idNum(b.id);
  }
  /** 자재별 활성 예약을 작업일 순으로 재고에 배분 → 부족분 계산 */
  function materialLedger(state) {
    return state.materials.map((m) => {
      const active = state.reservations.filter((r) => r.materialId === m.id && r.status === 'reserved').sort(cmpRes);
      let cum = 0;
      const rows = active.map((r) => {
        cum = r2(cum + r.qty);
        const shortage = r2(Math.max(0, Math.min(r.qty, cum - m.stock)));
        return Object.assign({}, r, { cum, shortage });
      });
      return { material: m, reserved: cum, available: r2(m.stock - cum), rows };
    });
  }
  function reservationPreview(state, { materialId, qty, date, jobId }) {
    const s = clone(state);
    const id = 'R' + (s.seq + 1);
    s.reservations.push({ id, jobId, materialId, qty: Number(qty), date, status: 'reserved' });
    const before = Object.fromEntries(materialLedger(state).find((L) => L.material.id === materialId).rows.map((r) => [r.id, r.shortage]));
    const L = materialLedger(s).find((x) => x.material.id === materialId);
    const self = L.rows.find((r) => r.id === id);
    const hurt = L.rows.filter((r) => r.id !== id && r.shortage > (before[r.id] || 0));
    return { shortage: self ? self.shortage : 0, available: r2(L.material.stock - (L.reserved - Number(qty))), hurt, stock: L.material.stock };
  }

  /* ───────────── 탐지 ───────────── */
  function mk(rule, job, ref, sev, detail, amount, metric, fix) {
    return {
      key: `${rule}:${job.id}:${ref}`,
      rule,
      cat: RULES[rule].cat,
      sev,
      title: RULES[rule].name,
      detail,
      jobId: job.id,
      jobIds: [job.id],
      amount: amount == null ? null : Math.round(amount),
      metric: metric || null,
      fix: fix || null,
    };
  }

  function detect(state, today) {
    const F = [];
    const mat = (id) => byId(state.materials, id);
    const crewName = (id) => (byId(state.crews, id) || { name: id }).name;

    for (const job of state.jobs) {
      if (job.status === 'canceled') continue;

      /* A1 승인 없이 시공 */
      for (const co of job.changeOrders) {
        if (co.performed && co.status !== 'approved') {
          const why = co.status === 'rejected' ? '고객이 거절했는데 시공 기록이 있습니다' : '시공 기록은 있는데 고객 승인 기록이 없습니다';
          F.push(mk('A1', job, co.id, 'critical', `'${co.title}' ${why}`, totals(co.items).total, 'unapproved', { type: 'approveCO', jobId: job.id, coId: co.id }));
        }
      }
      /* A2 견적 초과 사용 */
      const used = usedBy(job);
      const allowed = allowedBy(job);
      for (const mid of Object.keys(used)) {
        const ex = r2(used[mid] - (allowed[mid] || 0));
        if (ex > 0) {
          const m = mat(mid);
          F.push(
            mk('A2', job, mid, 'critical', `${m.name} ${fq(used[mid])}${m.unit} 사용 · 견적과 추가 작업 합계 ${fq(allowed[mid] || 0)}${m.unit} → ${fq(ex)}${m.unit} 초과`, withVat(Math.round(ex * m.price)), 'unapproved', {
              type: 'addCO',
              jobId: job.id,
              materialId: mid,
              qty: ex,
            })
          );
        }
      }
      /* A3 결정 안 된 추가 작업 남은 채 완료 */
      if (job.stage === 'settle') {
        for (const co of job.changeOrders) {
          if (co.status === 'pending' && !co.performed) {
            F.push(mk('A3', job, co.id, 'warning', `'${co.title}' 승인 여부가 정해지지 않아 청구 범위를 확정할 수 없습니다`, totals(co.items).total, 'unapproved', { type: 'approveCO', jobId: job.id, coId: co.id }));
          }
        }
      }

      /* B1 미청구 */
      if (job.stage === 'settle' && !job.invoice && job.completedAt) {
        const days = diffDays(today, job.completedAt.slice(0, 10));
        if (days >= 1) {
          F.push(mk('B1', job, 'inv', days >= 7 ? 'critical' : 'warning', `완료 ${days}일 경과 · 청구서를 아직 발행하지 않았습니다`, expectedTotal(job), 'unbilled', { type: 'issueInvoice', jobId: job.id }));
        }
      }
      if (job.invoice) {
        const keys = new Set(job.invoice.lines.map((l) => l.key));
        const missing = expectedLines(job).filter((l) => !keys.has(l.key));
        /* B2 청구서 누락 항목 */
        const missQ = missing.filter((l) => l.source === 'quote');
        if (missQ.length) {
          F.push(mk('B2', job, 'quote', 'critical', `견적 항목 ${missQ.length}개(${missQ.map((l) => l.name).join(', ')})가 청구서에 없습니다`, totals(missQ).total, 'unbilled', { type: 'addInvoiceLines', jobId: job.id, keys: missQ.map((l) => l.key) }));
        }
        const coIds = [...new Set(missing.filter((l) => l.source === 'co').map((l) => l.coId))];
        for (const coId of coIds) {
          const co = byId(job.changeOrders, coId);
          const lines = missing.filter((l) => l.coId === coId);
          F.push(mk('B2', job, coId, 'critical', `승인된 추가 작업 '${co.title}'이 청구서에 없습니다`, totals(lines).total, 'unbilled', { type: 'addInvoiceLines', jobId: job.id, keys: lines.map((l) => l.key) }));
        }
        /* B3 사용 자재 미청구 (B2와 이중 집계하지 않음) */
        const billed = sumBy(job.invoice.lines);
        const covered = sumBy(missing);
        for (const mid of Object.keys(used)) {
          const un = r2(used[mid] - (billed[mid] || 0) - (covered[mid] || 0));
          if (un > 0) {
            const m = mat(mid);
            F.push(
              mk('B3', job, mid, 'warning', `${m.name} ${fq(used[mid])}${m.unit} 사용 · 청구 ${fq(billed[mid] || 0)}${m.unit} → ${fq(un)}${m.unit} 미청구`, withVat(Math.round(un * m.price)), 'unbilled', {
                type: 'addExtraLine',
                jobId: job.id,
                materialId: mid,
                qty: un,
              })
            );
          }
        }
        /* B4 수금 기한 경과 */
        const it = invoiceTotals(job);
        if (it.balance > 0 && job.invoice.dueDate < today) {
          const od = diffDays(today, job.invoice.dueDate);
          F.push(mk('B4', job, 'due', od >= 15 ? 'critical' : 'warning', `지급 기한 ${md(job.invoice.dueDate)}에서 ${od}일 지났는데 잔액이 남아 있습니다`, it.balance, 'overdue', { type: 'payment', jobId: job.id }));
        }
      }
      /* B5 작업일 경과 후 완료 미처리 */
      if (job.stage === 'work' && job.status === 'open' && job.assignments.length) {
        const last = job.assignments.map((a) => a.date).sort().pop();
        const days = diffDays(today, last);
        if (days >= 1) {
          F.push(mk('B5', job, 'late', 'warning', `마지막 작업일 ${md(last)} 이후 ${days}일째 완료 처리 안 됨 · 청구가 늦어집니다`, expectedTotal(job), null, { type: 'complete', jobId: job.id }));
        }
      }
    }

    /* M1·M2 자재 */
    for (const L of materialLedger(state)) {
      const m = L.material;
      for (const r of L.rows) {
        if (r.shortage <= 0) continue;
        const job = byId(state.jobs, r.jobId);
        const earlier = [...new Set(L.rows.filter((x) => cmpRes(x, r) < 0 && x.jobId !== r.jobId).map((x) => x.jobId))];
        const f = mk('M1', job, r.id, diffDays(r.date, today) <= 2 ? 'critical' : 'warning', `${m.name} 재고 ${fq(m.stock)}${m.unit} · 예약 합계 ${fq(L.reserved)}${m.unit} → ${md(r.date)} 예약분 ${fq(r.shortage)}${m.unit} 부족`, null, null, {
          type: 'material',
          materialId: m.id,
          reservationId: r.id,
        });
        f.jobIds = [r.jobId, ...earlier];
        F.push(f);
      }
      const byJob = {};
      for (const r of L.rows) (byJob[r.jobId] = byJob[r.jobId] || []).push(r);
      for (const jid of Object.keys(byJob)) {
        const rs = byJob[jid];
        if (rs.length < 2) continue;
        const job = byId(state.jobs, jid);
        F.push(mk('M2', job, m.id, 'warning', `${m.name} 예약 ${rs.length}건(${rs.map((r) => fq(r.qty) + m.unit + ' ' + md(r.date)).join(', ')}) · 이중 입력인지 확인하세요`, null, null, { type: 'mergeReservations', ids: rs.map((r) => r.id) }));
      }
    }

    /* C1·C2 일정 */
    const travel = state.settings.travelMin;
    const groups = {};
    for (const e of scheduleEntries(state)) {
      if (e.date < today) continue;
      const job = byId(state.jobs, e.jobId);
      if (job.status !== 'open') continue;
      (groups[e.crewId + '|' + e.date] = groups[e.crewId + '|' + e.date] || []).push(e);
    }
    const label = (e) => `${e.start}~${e.end} ${e.kind === 'survey' ? '현장 확인' : '시공'} '${e.title}'`;
    for (const k of Object.keys(groups)) {
      const g = groups[k].sort((a, b) => toMin(a.start) - toMin(b.start));
      for (let i = 0; i < g.length; i++) {
        for (let j = i + 1; j < g.length; j++) {
          const a = g[i];
          const b = g[j];
          if (!overlaps(a, b)) continue;
          const job = byId(state.jobs, b.jobId);
          const f = mk('C1', job, [a.id, b.id].sort().join('|'), 'critical', `${crewName(a.crewId)} ${md(a.date)} · ${label(a)}와 ${label(b)}가 겹칩니다`, null, null, { type: 'reschedule', jobId: b.jobId, entryId: b.id });
          f.key = 'C1:' + [a.id, b.id].sort().join('|');
          f.jobIds = [...new Set([b.jobId, a.jobId])];
          f.entryIds = [a.id, b.id];
          f.date = a.date;
          F.push(f);
        }
      }
      for (let i = 0; i + 1 < g.length; i++) {
        const a = g[i];
        const b = g[i + 1];
        if (overlaps(a, b) || a.address === b.address) continue;
        const gap = toMin(b.start) - toMin(a.end);
        if (gap >= 0 && gap < travel) {
          const job = byId(state.jobs, b.jobId);
          const f = mk('C2', job, '', 'warning', `${crewName(a.crewId)} ${md(a.date)} · '${a.title}' ${a.end} 종료 후 ${gap}분 만에 '${b.title}' ${b.start} 시작 (주소 다름, 기준 ${travel}분)`, null, null, { type: 'reschedule', jobId: b.jobId, entryId: b.id });
          f.key = 'C2:' + a.id + '|' + b.id;
          f.jobIds = [...new Set([b.jobId, a.jobId])];
          f.entryIds = [a.id, b.id];
          f.date = a.date;
          F.push(f);
        }
      }
    }

    F.sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev] || CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat) || a.rule.localeCompare(b.rule) || a.key.localeCompare(b.key));
    return F;
  }

  function splitAcked(state, findings) {
    const open = [];
    const acked = [];
    for (const f of findings) (state.acks[f.key] ? acked : open).push(f);
    return { open, acked };
  }

  function summarize(findings) {
    const byCat = {};
    for (const c of CAT_ORDER) byCat[c] = { total: 0, critical: 0, warning: 0, info: 0 };
    const money = { unapproved: 0, unbilled: 0, overdue: 0 };
    let critical = 0;
    for (const f of findings) {
      byCat[f.cat].total++;
      byCat[f.cat][f.sev]++;
      if (f.sev === 'critical') critical++;
      if (f.metric && f.amount) money[f.metric] += f.amount;
    }
    return { total: findings.length, critical, byCat, money };
  }

  /* ───────────── 상태 전이(액션) ───────────── */
  function getJob(s, id) {
    const j = byId(s.jobs, id);
    if (!j) throw new ActionError('NOT_FOUND', '작업을 찾을 수 없습니다');
    return j;
  }
  function requireStage(job, ...stages) {
    if (job.status !== 'open') throw new ActionError('CLOSED', '종결되었거나 취소된 작업입니다');
    if (!stages.includes(job.stage)) {
      const need = stages.map((k) => STAGES[STAGE_INDEX[k]].label).join(' 또는 ');
      throw new ActionError('STAGE', `지금은 '${STAGES[STAGE_INDEX[job.stage]].label}' 단계입니다. 이 작업은 '${need}' 단계에서 할 수 있습니다`);
    }
  }
  function log(job, ctx, text) {
    job.history.push({ at: ctx.now, by: ctx.user || '사무실', text });
  }
  function required(v, msg) {
    if (v == null || String(v).trim() === '') throw new ActionError('REQUIRED', msg);
  }
  function checkTimes(date, start, end) {
    if (!isDate(date)) throw new ActionError('INVALID', '날짜를 입력하세요');
    if (!isTime(start) || !isTime(end)) throw new ActionError('INVALID', '시작·종료 시간을 입력하세요');
    if (toMin(start) >= toMin(end)) throw new ActionError('INVALID', '종료 시간이 시작 시간보다 늦어야 합니다');
  }
  function crewOf(s, crewId) {
    const c = byId(s.crews, crewId);
    if (!c) throw new ActionError('INVALID', '작업팀을 선택하세요');
    return c;
  }
  function materialOf(s, mid) {
    const m = byId(s.materials, mid);
    if (!m) throw new ActionError('INVALID', '자재를 선택하세요');
    return m;
  }
  function normItems(s, items) {
    if (!Array.isArray(items)) items = [];
    return items.map((it) => {
      required(it.name, '항목 이름을 입력하세요');
      const qty = Number(it.qty);
      const price = Number(it.unitPrice);
      if (!(qty > 0)) throw new ActionError('INVALID', `'${it.name}' 수량은 0보다 커야 합니다`);
      if (!(price >= 0)) throw new ActionError('INVALID', `'${it.name}' 단가를 확인하세요`);
      if (it.kind === 'material') materialOf(s, it.materialId);
      return {
        id: it.id || nextId(s, 'I'),
        kind: it.kind || 'etc',
        name: String(it.name).trim(),
        materialId: it.kind === 'material' ? it.materialId : null,
        qty: r2(qty),
        unit: it.unit || '식',
        unitPrice: Math.round(price),
      };
    });
  }
  function slotGuard(s, slot, excludeId, force) {
    const chk = checkSlot(s, slot, excludeId);
    if (chk.conflicts.length && !force) {
      const c = crewOf(s, slot.crewId);
      throw new ActionError('SCHEDULE_CONFLICT', `${c.name} ${md(slot.date)} ${slot.start}~${slot.end}에 다른 일정 ${chk.conflicts.length}건과 겹칩니다`, chk);
    }
    return chk;
  }
  function signatureGuard(method, signature) {
    if (!APPROVAL_METHODS.includes(method)) throw new ActionError('INVALID', '승인 방법을 선택하세요 (서명·문자·전화)');
    if (method === '서명' && !signature) throw new ActionError('SIGNATURE_REQUIRED', '고객 서명을 받아 주세요');
  }

  const ACTIONS = {
    createJob(s, a, ctx) {
      required(a.customerName, '고객 이름을 입력하세요');
      required(a.title, '문의 내용을 입력하세요');
      required(a.address, '주소를 입력하세요');
      const phone = String(a.phone || '').trim();
      let cust = phone ? s.customers.find((c) => c.phone === phone) : null;
      if (!cust) {
        cust = { id: nextId(s, 'C'), name: a.customerName.trim(), phone, address: a.address.trim() };
        s.customers.push(cust);
      }
      const id = nextId(s, 'J');
      const job = newJobRecord(s, {
        id,
        code: jobCode(s, ctx.today),
        title: a.title.trim(),
        customerId: cust.id,
        address: a.address.trim(),
        channel: a.channel || '전화',
        issue: String(a.issue || '').trim(),
        createdAt: ctx.now,
      });
      s.jobs.push(job);
      log(job, ctx, `문의 접수 (${job.channel})`);
      return { jobId: id };
    },

    scheduleSurvey(s, a, ctx) {
      const job = getJob(s, a.jobId);
      requireStage(job, 'inquiry', 'survey');
      crewOf(s, a.crewId);
      checkTimes(a.date, a.start, a.end);
      const slot = { crewId: a.crewId, date: a.date, start: a.start, end: a.end, address: job.address };
      const chk = slotGuard(s, slot, 'S:' + job.id, a.force);
      job.survey = Object.assign(job.survey || { doneAt: null, findings: '' }, { crewId: a.crewId, date: a.date, start: a.start, end: a.end });
      job.stage = 'survey';
      log(job, ctx, `현장 확인 예약 · ${crewOf(s, a.crewId).name} ${md(a.date)} ${a.start}` + (chk.conflicts.length ? ' (일정 겹침 알고 강행)' : ''));
      return { conflicts: chk.conflicts, tight: chk.tight };
    },

    recordSurvey(s, a, ctx) {
      const job = getJob(s, a.jobId);
      requireStage(job, 'inquiry', 'survey');
      required(a.findings, '현장 확인 결과를 입력하세요');
      job.survey = job.survey || { crewId: null, date: ctx.today, start: null, end: null };
      job.survey.findings = a.findings.trim();
      job.survey.doneAt = ctx.now;
      job.stage = 'quote';
      log(job, ctx, '현장 확인 결과 기록');
    },

    saveQuote(s, a, ctx) {
      const job = getJob(s, a.jobId);
      requireStage(job, 'quote', 'approval');
      job.quote.items = normItems(s, a.items);
      if (job.stage === 'approval') {
        job.stage = 'quote';
        job.quote.sentAt = null;
        log(job, ctx, `견적 수정 (${won(quoteTotals(job).total)}) · 다시 보내야 합니다`);
      } else {
        log(job, ctx, `견적 저장 (${won(quoteTotals(job).total)})`);
      }
    },

    sendQuote(s, a, ctx) {
      const job = getJob(s, a.jobId);
      requireStage(job, 'quote');
      if (!job.quote.items.length) throw new ActionError('EMPTY_QUOTE', '견적 항목이 없습니다. 항목을 추가한 뒤 보내세요');
      job.quote.sentAt = ctx.now;
      job.quote.sentVia = a.via || '문자';
      job.stage = 'approval';
      log(job, ctx, `견적 발송 (${job.quote.sentVia}) · ${won(quoteTotals(job).total)}`);
    },

    approveQuote(s, a, ctx) {
      const job = getJob(s, a.jobId);
      requireStage(job, 'approval');
      signatureGuard(a.method, a.signature);
      required(a.by, '승인한 사람 이름을 입력하세요');
      job.approval = { at: ctx.now, method: a.method, by: a.by.trim(), signature: a.signature || null, amount: quoteTotals(job).total };
      job.stage = 'schedule';
      log(job, ctx, `고객 승인 (${a.method}, ${a.by.trim()}) · ${won(job.approval.amount)}`);
    },

    declineQuote(s, a, ctx) {
      const job = getJob(s, a.jobId);
      requireStage(job, 'approval');
      job.status = 'canceled';
      job.canceledReason = String(a.reason || '고객 거절');
      for (const r of s.reservations) if (r.jobId === job.id && r.status === 'reserved') r.status = 'released';
      log(job, ctx, `견적 거절 · ${job.canceledReason}`);
    },

    assignCrew(s, a, ctx) {
      const job = getJob(s, a.jobId);
      requireStage(job, 'schedule', 'work');
      const crew = crewOf(s, a.crewId);
      checkTimes(a.date, a.start, a.end);
      const slot = { crewId: a.crewId, date: a.date, start: a.start, end: a.end, address: job.address };
      const chk = slotGuard(s, slot, null, a.force);
      const id = nextId(s, 'A');
      job.assignments.push({ id, crewId: a.crewId, date: a.date, start: a.start, end: a.end });
      job.stage = 'work';
      log(job, ctx, `작업 배정 · ${crew.name} ${md(a.date)} ${a.start}~${a.end}` + (chk.conflicts.length ? ' (일정 겹침 알고 강행)' : ''));
      return { assignmentId: id, conflicts: chk.conflicts, tight: chk.tight };
    },

    updateSlot(s, a, ctx) {
      // 시공 배정 또는 현장 확인 방문 일정 변경 (충돌 해소용)
      const job = getJob(s, a.jobId);
      if (job.status !== 'open') throw new ActionError('CLOSED', '종결되었거나 취소된 작업입니다');
      const crew = crewOf(s, a.crewId);
      checkTimes(a.date, a.start, a.end);
      const slot = { crewId: a.crewId, date: a.date, start: a.start, end: a.end, address: job.address };
      const chk = slotGuard(s, slot, a.entryId, a.force);
      if (String(a.entryId).startsWith('S:')) {
        if (!job.survey) throw new ActionError('NOT_FOUND', '현장 확인 일정이 없습니다');
        Object.assign(job.survey, { crewId: a.crewId, date: a.date, start: a.start, end: a.end });
        log(job, ctx, `현장 확인 일정 변경 · ${crew.name} ${md(a.date)} ${a.start}`);
      } else {
        const asg = byId(job.assignments, a.entryId);
        if (!asg) throw new ActionError('NOT_FOUND', '배정을 찾을 수 없습니다');
        Object.assign(asg, { crewId: a.crewId, date: a.date, start: a.start, end: a.end });
        log(job, ctx, `배정 변경 · ${crew.name} ${md(a.date)} ${a.start}~${a.end}`);
      }
      return { conflicts: chk.conflicts, tight: chk.tight };
    },

    removeAssignment(s, a, ctx) {
      const job = getJob(s, a.jobId);
      requireStage(job, 'work');
      const asg = byId(job.assignments, a.assignmentId);
      if (!asg) throw new ActionError('NOT_FOUND', '배정을 찾을 수 없습니다');
      job.assignments = job.assignments.filter((x) => x.id !== asg.id);
      if (!job.assignments.length && !job.usage.length) job.stage = 'schedule';
      log(job, ctx, `배정 취소 · ${md(asg.date)} ${asg.start}`);
    },

    reserveMaterial(s, a, ctx) {
      const job = getJob(s, a.jobId);
      requireStage(job, 'quote', 'approval', 'schedule', 'work');
      const m = materialOf(s, a.materialId);
      const qty = r2(Number(a.qty));
      if (!(qty > 0)) throw new ActionError('INVALID', '예약 수량은 0보다 커야 합니다');
      if (!isDate(a.date)) throw new ActionError('INVALID', '사용 예정일을 입력하세요');
      const existing = s.reservations.filter((r) => r.jobId === job.id && r.materialId === m.id && r.status === 'reserved');
      if (existing.length && !a.allowDuplicate) {
        throw new ActionError('DUPLICATE_RESERVATION', `이 작업에 ${m.name}이(가) 이미 ${existing.map((r) => fq(r.qty) + m.unit).join(', ')} 예약되어 있습니다`, { existing });
      }
      const pv = reservationPreview(s, { materialId: m.id, qty, date: a.date, jobId: job.id });
      if ((pv.shortage > 0 || pv.hurt.length) && !a.force) {
        throw new ActionError('SHORTAGE', `${m.name} 재고가 모자랍니다 · 이 예약 ${fq(pv.shortage)}${m.unit} 부족` + (pv.hurt.length ? `, 다른 작업 ${pv.hurt.length}건이 부족해집니다` : ''), pv);
      }
      const id = nextId(s, 'R');
      s.reservations.push({ id, jobId: job.id, materialId: m.id, qty, date: a.date, status: 'reserved', createdAt: ctx.now });
      log(job, ctx, `자재 예약 · ${m.name} ${fq(qty)}${m.unit} (${md(a.date)})` + (pv.shortage > 0 ? ' · 재고 부족 알고 강행' : ''));
      return { reservationId: id, shortage: pv.shortage };
    },

    updateReservation(s, a, ctx) {
      const r = byId(s.reservations, a.reservationId);
      if (!r || r.status !== 'reserved') throw new ActionError('NOT_FOUND', '활성 예약을 찾을 수 없습니다');
      const job = getJob(s, r.jobId);
      if (a.qty != null) {
        const q = r2(Number(a.qty));
        if (!(q > 0)) throw new ActionError('INVALID', '예약 수량은 0보다 커야 합니다');
        r.qty = q;
      }
      if (a.date != null) {
        if (!isDate(a.date)) throw new ActionError('INVALID', '날짜를 확인하세요');
        r.date = a.date;
      }
      const m = byId(s.materials, r.materialId);
      log(job, ctx, `자재 예약 변경 · ${m.name} ${fq(r.qty)}${m.unit} (${md(r.date)})`);
    },

    mergeReservations(s, a, ctx) {
      const rs = (a.ids || []).map((id) => byId(s.reservations, id)).filter((r) => r && r.status === 'reserved');
      if (rs.length < 2) throw new ActionError('INVALID', '합칠 예약이 2건 이상이어야 합니다');
      if (new Set(rs.map((r) => r.jobId + r.materialId)).size !== 1) throw new ActionError('INVALID', '같은 작업·같은 자재 예약만 합칠 수 있습니다');
      rs.sort(cmpRes);
      const keep = rs[0];
      const qty = a.qty != null ? r2(Number(a.qty)) : keep.qty;
      keep.qty = qty;
      for (const r of rs.slice(1)) r.status = 'canceled';
      const m = byId(s.materials, keep.materialId);
      log(getJob(s, keep.jobId), ctx, `중복 예약 정리 · ${m.name} ${rs.length}건 → 1건 ${fq(qty)}${m.unit}`);
      return { reservationId: keep.id };
    },

    cancelReservation(s, a, ctx) {
      const r = byId(s.reservations, a.reservationId);
      if (!r || r.status !== 'reserved') throw new ActionError('NOT_FOUND', '활성 예약을 찾을 수 없습니다');
      r.status = 'canceled';
      const m = byId(s.materials, r.materialId);
      log(getJob(s, r.jobId), ctx, `자재 예약 취소 · ${m.name} ${fq(r.qty)}${m.unit}`);
    },

    restock(s, a, ctx) {
      const m = materialOf(s, a.materialId);
      const qty = r2(Number(a.qty));
      if (!(qty > 0)) throw new ActionError('INVALID', '입고 수량은 0보다 커야 합니다');
      m.stock = r2(m.stock + qty);
      s.stockLog.push({ at: ctx.now, materialId: m.id, qty, note: a.note || '입고' });
    },

    useMaterial(s, a, ctx) {
      const job = getJob(s, a.jobId);
      requireStage(job, 'work');
      const m = materialOf(s, a.materialId);
      const qty = r2(Number(a.qty));
      if (!(qty > 0)) throw new ActionError('INVALID', '사용 수량은 0보다 커야 합니다');
      if (m.stock < qty) throw new ActionError('INSUFFICIENT_STOCK', `${m.name} 재고가 ${fq(m.stock)}${m.unit}뿐입니다. 입고를 먼저 기록하세요`);
      m.stock = r2(m.stock - qty);
      job.usage.push({ id: nextId(s, 'U'), materialId: m.id, qty, at: ctx.now, by: a.by || ctx.user || '', coId: a.coId || null });
      let left = qty;
      const rs = s.reservations.filter((r) => r.jobId === job.id && r.materialId === m.id && r.status === 'reserved').sort(cmpRes);
      for (const r of rs) {
        if (left <= 0) break;
        const take = Math.min(r.qty, left);
        left = r2(left - take);
        if (take >= r.qty) r.status = 'used';
        else r.qty = r2(r.qty - take);
      }
      const allowed = allowedBy(job)[m.id] || 0;
      const used = usedBy(job)[m.id];
      log(job, ctx, `자재 사용 · ${m.name} ${fq(qty)}${m.unit}`);
      return { overQuote: r2(Math.max(0, used - allowed)) };
    },

    addChangeOrder(s, a, ctx) {
      const job = getJob(s, a.jobId);
      requireStage(job, 'schedule', 'work');
      required(a.title, '추가 작업 내용을 입력하세요');
      const items = normItems(s, a.items);
      if (!items.length) throw new ActionError('EMPTY_CO', '추가 작업 금액 항목을 1개 이상 넣으세요');
      const co = { id: nextId(s, 'CO'), title: a.title.trim(), items, status: 'pending', requestedAt: ctx.now, decidedAt: null, approval: null, performed: !!a.performed, performedAt: a.performed ? ctx.now : null };
      job.changeOrders.push(co);
      log(job, ctx, `추가 작업 요청 · ${co.title} ${won(totals(items).total)}` + (co.performed ? ' · 승인 전 시공' : ''));
      return { coId: co.id };
    },

    approveChangeOrder(s, a, ctx) {
      const job = getJob(s, a.jobId);
      if (job.status === 'canceled') throw new ActionError('CLOSED', '취소된 작업입니다');
      const co = byId(job.changeOrders, a.coId);
      if (!co) throw new ActionError('NOT_FOUND', '추가 작업을 찾을 수 없습니다');
      if (co.status === 'approved') throw new ActionError('INVALID', '이미 승인된 추가 작업입니다');
      signatureGuard(a.method, a.signature);
      required(a.by, '승인한 사람 이름을 입력하세요');
      co.status = 'approved';
      co.decidedAt = ctx.now;
      co.approval = { method: a.method, by: a.by.trim(), signature: a.signature || null };
      log(job, ctx, `추가 작업 승인 (${a.method}, ${a.by.trim()}) · ${co.title} ${won(totals(co.items).total)}`);
    },

    rejectChangeOrder(s, a, ctx) {
      const job = getJob(s, a.jobId);
      const co = byId(job.changeOrders, a.coId);
      if (!co) throw new ActionError('NOT_FOUND', '추가 작업을 찾을 수 없습니다');
      if (co.status !== 'pending') throw new ActionError('INVALID', '대기 중인 추가 작업만 거절할 수 있습니다');
      co.status = 'rejected';
      co.decidedAt = ctx.now;
      log(job, ctx, `추가 작업 거절 · ${co.title}`);
    },

    markPerformed(s, a, ctx) {
      const job = getJob(s, a.jobId);
      requireStage(job, 'work');
      const co = byId(job.changeOrders, a.coId);
      if (!co) throw new ActionError('NOT_FOUND', '추가 작업을 찾을 수 없습니다');
      if (co.status === 'rejected') throw new ActionError('INVALID', '거절된 추가 작업은 시공할 수 없습니다');
      co.performed = true;
      co.performedAt = ctx.now;
      log(job, ctx, `추가 작업 시공 · ${co.title}` + (co.status !== 'approved' ? ' (승인 전)' : ''));
      return { unapproved: co.status !== 'approved' };
    },

    completeWork(s, a, ctx) {
      const job = getJob(s, a.jobId);
      requireStage(job, 'work');
      const unapproved = job.changeOrders.filter((c) => c.performed && c.status !== 'approved');
      if (unapproved.length) throw new ActionError('UNAPPROVED_CO', `승인 없이 시공한 추가 작업 ${unapproved.length}건이 있습니다. 고객 승인을 먼저 받으세요`, { coIds: unapproved.map((c) => c.id) });
      const pending = job.changeOrders.filter((c) => c.status === 'pending');
      if (pending.length) throw new ActionError('PENDING_CO', `결정 안 된 추가 작업 ${pending.length}건이 있습니다. 승인 또는 거절을 기록하세요`, { coIds: pending.map((c) => c.id) });
      job.completedAt = ctx.now;
      job.completionNote = String(a.note || '').trim();
      let released = 0;
      for (const r of s.reservations) {
        if (r.jobId === job.id && r.status === 'reserved') {
          r.status = 'released';
          released++;
        }
      }
      const before = job.assignments.length;
      job.assignments = job.assignments.filter((x) => x.date <= ctx.today);
      job.stage = 'settle';
      log(job, ctx, '작업 완료' + (released ? ` · 남은 예약 ${released}건 해제` : '') + (before !== job.assignments.length ? ` · 남은 배정 ${before - job.assignments.length}건 정리` : ''));
      return { released };
    },

    issueInvoice(s, a, ctx) {
      const job = getJob(s, a.jobId);
      requireStage(job, 'settle');
      if (job.invoice) throw new ActionError('INVALID', '이미 청구서를 발행했습니다');
      const exp = expectedLines(job);
      const chosen = a.keys ? exp.filter((l) => a.keys.includes(l.key)) : exp;
      const extras = (a.extra || []).map((x) => extraLine(s, x));
      const lines = chosen.concat(extras).map((l) => Object.assign({ id: nextId(s, 'L') }, l));
      if (!lines.length) throw new ActionError('EMPTY_INVOICE', '청구할 항목을 1개 이상 고르세요');
      const days = a.dueDays != null ? Number(a.dueDays) : s.settings.paymentTermDays;
      job.invoice = { id: nextId(s, 'INV'), no: 'INV-' + job.code, issuedAt: ctx.now, dueDate: addDays(ctx.today, days), lines, payments: [] };
      log(job, ctx, `청구서 발행 · ${won(totals(lines).total)} (기한 ${md(job.invoice.dueDate)})`);
    },

    addInvoiceLines(s, a, ctx) {
      const job = getJob(s, a.jobId);
      if (!job.invoice) throw new ActionError('INVALID', '청구서를 먼저 발행하세요');
      if (job.status === 'closed') job.status = 'open';
      const have = new Set(job.invoice.lines.map((l) => l.key));
      const add = expectedLines(job).filter((l) => (a.keys || []).includes(l.key) && !have.has(l.key));
      const extras = (a.extra || []).map((x) => extraLine(s, x));
      const lines = add.concat(extras).map((l) => Object.assign({ id: nextId(s, 'L') }, l));
      if (!lines.length) throw new ActionError('INVALID', '추가할 항목이 없습니다');
      job.invoice.lines.push(...lines);
      job.closedAt = null;
      log(job, ctx, `청구서 항목 추가 · ${lines.map((l) => l.name).join(', ')} ${won(totals(lines).total)}`);
    },

    recordPayment(s, a, ctx) {
      const job = getJob(s, a.jobId);
      if (!job.invoice) throw new ActionError('INVALID', '청구서를 먼저 발행하세요');
      const amt = Math.round(Number(a.amount));
      if (!(amt > 0)) throw new ActionError('INVALID', '수금액은 0보다 커야 합니다');
      const bal = invoiceTotals(job).balance;
      if (amt > bal) throw new ActionError('OVERPAY', `잔액 ${won(bal)}보다 많이 입력했습니다`);
      job.invoice.payments.push({ id: nextId(s, 'P'), at: a.date ? a.date + ' 00:00' : ctx.now, amount: amt, method: a.method || '계좌이체' });
      const left = invoiceTotals(job).balance;
      if (left === 0) {
        job.status = 'closed';
        job.closedAt = ctx.now;
      }
      log(job, ctx, `수금 ${won(amt)} (${a.method || '계좌이체'})` + (left === 0 ? ' · 정산 완료' : ` · 잔액 ${won(left)}`));
      return { balance: left };
    },

    cancelJob(s, a, ctx) {
      const job = getJob(s, a.jobId);
      if (job.status !== 'open') throw new ActionError('CLOSED', '이미 종결되었거나 취소된 작업입니다');
      if (job.invoice) throw new ActionError('INVALID', '청구서를 발행한 작업은 취소할 수 없습니다');
      job.status = 'canceled';
      job.canceledReason = String(a.reason || '').trim() || '취소';
      for (const r of s.reservations) if (r.jobId === job.id && r.status === 'reserved') r.status = 'released';
      job.assignments = job.assignments.filter((x) => x.date < ctx.today);
      log(job, ctx, `작업 취소 · ${job.canceledReason}`);
    },

    ack(s, a, ctx) {
      required(a.key, '대상 경고가 없습니다');
      s.acks[a.key] = { at: ctx.now, note: String(a.note || '').trim(), by: ctx.user || '' };
    },
    unack(s, a) {
      delete s.acks[a.key];
    },
  };

  function extraLine(s, x) {
    const m = materialOf(s, x.materialId);
    const qty = r2(Number(x.qty));
    if (!(qty > 0)) throw new ActionError('INVALID', '수량을 확인하세요');
    return { key: 'X:' + m.id, source: 'extra', coId: null, kind: 'material', name: m.name, materialId: m.id, qty, unit: m.unit, unitPrice: m.price };
  }

  /** 상태를 바꾸지 않고 새 상태를 돌려준다. 가드 위반은 ActionError */
  function apply(state, action, ctx) {
    const fn = ACTIONS[action && action.type];
    if (!fn) throw new ActionError('UNKNOWN', '알 수 없는 작업입니다: ' + (action && action.type));
    const s = clone(state);
    const c = Object.assign({ user: '사무실' }, ctx);
    if (!c.today || !c.now) throw new ActionError('INVALID', 'ctx.today / ctx.now가 필요합니다');
    const result = fn(s, action, c) || {};
    return { state: s, result };
  }

  /* ───────────── 예시 데이터 ───────────── */
  function buildSampleState(today) {
    const s = starterState();

    const L = (sid, qty = 1) => {
      const c = byId(s.catalog, sid);
      return { id: nextId(s, 'I'), kind: 'labor', name: c.name, materialId: null, qty, unit: c.unit, unitPrice: c.price };
    };
    let ph = 100;
    const cust = (name, address) => {
      const c = { id: nextId(s, 'C'), name, phone: '010-0000-0' + ph++, address };
      s.customers.push(c);
      return c;
    };
    const res = (jobId, mid, qty, date, status = 'reserved') => s.reservations.push({ id: nextId(s, 'R'), jobId, materialId: mid, qty, date, status, createdAt: at(-1, '17:00') });
    const use = (job, mid, qty, when) => job.usage.push({ id: nextId(s, 'U'), materialId: mid, qty, at: when, by: '', coId: null });

    const co = (job, o) => {
      const c = Object.assign({ id: nextId(s, 'CO'), status: 'pending', requestedAt: null, decidedAt: null, approval: null, performed: false, performedAt: null }, o);
      job.changeOrders.push(c);
      return c;
    };
    const job = (createdDay, o, cst) => {
      const id = nextId(s, 'J');
      const j = newJobRecord(s, Object.assign({ id, code: jobCode(s, T(createdDay)), createdAt: at(createdDay, '09:20'), customerId: cst.id, address: cst.address }, o));
      s.jobs.push(j);
      return j;
    };
    const H = (j, when, text, by = '사무실') => j.history.push({ at: when, by, text });

    // J1 접수
    const j1 = job(0, { title: '싱크대 배수 막힘', issue: '어제부터 물이 잘 안 내려가고 냄새가 남', channel: '전화' }, cust('한소영', '푸른마을아파트 103동 702호'));

    H(j2, at(-1, '09:20'), '문의 접수 (카톡)');
    H(j2, at(-1, '11:05'), `현장 확인 예약 · 1팀 ${md(T(1))} 10:00`);

    // J3 견적 작성 중
    const j3 = job(-3, { title: '난방 분배기 교체', issue: '작은방 난방이 안 됨, 분배기에서 물 샘', channel: '전화', stage: 'quote', survey: { crewId: 'c3', date: T(-1), start: '14:00', end: '14:40', doneAt: at(-1, '14:40'), findings: '분배기 6구 본체 부식, 작은방 밸브 2개 고착. 분배기 통째 교체 권장.' } }, cust('서민아', '새솔아파트 207동 1102호'));
    j3.quote.items = [M('m9', 1), L('s7'), M('m6', 2)];
    H(j3, at(-3, '09:20'), '문의 접수 (전화)');
    H(j3, at(-1, '14:40'), '현장 확인 결과 기록', '오세훈');

    // J4 고객 승인 대기
    const j4 = job(-4, { title: '주방 수전 교체', issue: '수전 손잡이 헐거움, 밑에서 물이 똑똑 떨어짐', channel: '문자', stage: 'approval', survey: { crewId: 'c3', date: T(-3), start: '16:00', end: '16:30', doneAt: at(-3, '16:30'), findings: '수전 카트리지 마모. 수전 교체가 수리보다 저렴.' } }, cust('강지혜', '은행나무로 18 단독주택'));
    j4.quote.items = [M('m7', 1), L('s5'), M('m11', 1)];
    j4.quote.sentAt = at(-2, '10:10');
    j4.quote.sentVia = '문자';
    H(j4, at(-2, '10:10'), `견적 발송 (문자) · ${won(totals(j4.quote.items).total)}`);

    // J5 배정 대기 (자재는 미리 예약)
    const j5 = job(-6, { title: '세탁실 배수관 교체', issue: '세탁기 배수 시 바닥으로 역류', channel: '전화', stage: 'schedule', survey: { crewId: 'c3', date: T(-5), start: '11:00', end: '11:40', doneAt: at(-5, '11:40'), findings: '배수관 50A 구간 8m 노후, 트랩 파손.' } }, cust('임재훈', '강변로 220 101호'));
    j5.quote.items = [M('m4', 8), M('m12', 1), L('s3', 1)];

    j5.quote.sentVia = '문자';
