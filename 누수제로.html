    const D = (n) => E.addDays(TODAY, n);
    const rules = (s, today = TODAY) => E.detect(s, today).map((f) => f.rule);
    const count = (s, rule, today = TODAY) => rules(s, today).filter((r) => r === rule).length;

    // 공통 흐름: 접수 → 현장 확인 → 견적 → 승인 → 배정
    function toWork(s0, opt = {}) {
      let s = s0 || E.starterState();
      let r = run(s, 'createJob', { customerName: '테스트 고객', phone: opt.phone || '010-9999-0001', address: opt.address || '시험로 1', title: opt.title || '배관 교체' });
      s = r.state;
      const jobId = r.result.jobId;
      s = run(s, 'recordSurvey', { jobId, findings: '배관 노후' }).state;
      const items = opt.items || [
        { kind: 'material', name: 'PVC 배수관 50A', materialId: 'm4', qty: 4, unit: 'm', unitPrice: 6500 },
        { kind: 'labor', name: '배관 교체 공임', qty: 1, unit: '인·일', unitPrice: 250000 },
      ];
      s = run(s, 'saveQuote', { jobId, items }).state;
      s = run(s, 'sendQuote', { jobId, via: '문자' }).state;
      s = run(s, 'approveQuote', { jobId, method: '문자', by: '테스트 고객' }).state;
      if (opt.noAssign) return { s, jobId };
      s = run(s, 'assignCrew', { jobId, crewId: opt.crewId || 'c1', date: opt.date || D(1), start: opt.start || '09:00', end: opt.end || '12:00', force: opt.force }).state;
      return { s, jobId };
    }
    const job = (s, id) => s.jobs.find((j) => j.id === id);
    const mat = (s, id) => s.materials.find((m) => m.id === id);

    /* ── 계산 ── */
    t('계산', '라인 금액·공급가·부가세(원 미만 절사)·합계', () => {
      const lines = [
        { qty: 3, unitPrice: 3333 },
        { qty: 0.5, unitPrice: 250000 },
      ];
      eq(E.lineAmount(lines[0]), 9999);
      const tt = E.totals(lines);
      eq(tt, { supply: 134999, vat: 13499, total: 148498 });
    });
    t('계산', '모든 금액은 정수 원 단위', () => {
      const s = E.buildSampleState(TODAY);
      for (const j of s.jobs) {
        const q = E.quoteTotals(j);
        ok(Number.isInteger(q.total) && Number.isInteger(q.vat), j.code + ' 견적 합계가 정수가 아님');
      }
      for (const f of E.detect(s, TODAY)) if (f.amount != null) ok(Number.isInteger(f.amount), f.key + ' 금액이 정수가 아님');
    });

    /* ── 워크플로 ── */
    t('워크플로', '새 문의는 접수 단계로 생성되고 이력이 남는다', () => {
      const r = run(E.starterState(), 'createJob', { customerName: '김고객', phone: '010-1', address: '어딘가 1', title: '누수' });
      const j = job(r.state, r.result.jobId);
      eq(j.stage, 'inquiry');
      eq(j.history.length, 1);
      ok(/^\d{4}-\d{3}$/.test(j.code), '접수번호 형식');
    });
    t('워크플로', '같은 연락처로 다시 문의하면 기존 고객에 연결', () => {
      let s = E.starterState();
      s = run(s, 'createJob', { customerName: '김고객', phone: '010-1', address: 'A', title: '1' }).state;
      s = run(s, 'createJob', { customerName: '김고객', phone: '010-1', address: 'A', title: '2' }).state;
      eq(s.customers.length, 1);
      eq(s.jobs[0].customerId, s.jobs[1].customerId);
    });
    t('워크플로', '필수 입력 누락은 REQUIRED 오류', () => {
      throwsCode(() => run(E.starterState(), 'createJob', { customerName: '', address: 'x', title: 'y' }), 'REQUIRED');
    });
    t('워크플로', '현장 확인 예약 → 현장 단계, 결과 기록 → 견적 단계', () => {
      let s = E.starterState();
      const r = run(s, 'createJob', { customerName: 'a', address: 'b', title: 'c' });
      s = r.state;
      s = run(s, 'scheduleSurvey', { jobId: r.result.jobId, crewId: 'c3', date: D(1), start: '10:00', end: '10:30' }).state;
      eq(job(s, r.result.jobId).stage, 'survey');
      s = run(s, 'recordSurvey', { jobId: r.result.jobId, findings: '확인' }).state;
      eq(job(s, r.result.jobId).stage, 'quote');
    });
    t('워크플로', '빈 견적은 보낼 수 없다 (EMPTY_QUOTE)', () => {
      let s = E.starterState();
      const r = run(s, 'createJob', { customerName: 'a', address: 'b', title: 'c' });
      s = run(r.state, 'recordSurvey', { jobId: r.result.jobId, findings: 'x' }).state;
      throwsCode(() => run(s, 'sendQuote', { jobId: r.result.jobId }), 'EMPTY_QUOTE');
    });
    t('워크플로', '승인 전에는 작업 배정 불가 (STAGE)', () => {
      const { s, jobId } = toWork(null, { noAssign: true });
      const s2 = E.clone(s);
      job(s2, jobId).stage = 'approval';
      throwsCode(() => run(s2, 'assignCrew', { jobId, crewId: 'c1', date: D(1), start: '09:00', end: '10:00' }), 'STAGE');
    });
    t('워크플로', '서명 승인은 서명이 있어야 한다 (SIGNATURE_REQUIRED)', () => {
      let s = E.starterState();
      const r = run(s, 'createJob', { customerName: 'a', address: 'b', title: 'c' });
      const jobId = r.result.jobId;
      s = run(r.state, 'recordSurvey', { jobId, findings: 'x' }).state;
      s = run(s, 'saveQuote', { jobId, items: [{ kind: 'labor', name: '공임', qty: 1, unit: '식', unitPrice: 10000 }] }).state;
      s = run(s, 'sendQuote', { jobId }).state;
      throwsCode(() => run(s, 'approveQuote', { jobId, method: '서명', by: 'a' }), 'SIGNATURE_REQUIRED');
      const s2 = run(s, 'approveQuote', { jobId, method: '서명', by: 'a', signature: 'data:image/png;base64,AAA' }).state;
      eq(job(s2, jobId).stage, 'schedule');
      eq(job(s2, jobId).approval.amount, 11000);
    });
    t('워크플로', '승인 대기 중 견적을 고치면 다시 견적 단계로 돌아간다', () => {
      let s = E.starterState();
      const r = run(s, 'createJob', { customerName: 'a', address: 'b', title: 'c' });
      const jobId = r.result.jobId;
      s = run(r.state, 'recordSurvey', { jobId, findings: 'x' }).state;
      s = run(s, 'saveQuote', { jobId, items: [{ kind: 'labor', name: '공임', qty: 1, unit: '식', unitPrice: 10000 }] }).state;
      s = run(s, 'sendQuote', { jobId }).state;
      s = run(s, 'saveQuote', { jobId, items: [{ kind: 'labor', name: '공임', qty: 2, unit: '식', unitPrice: 10000 }] }).state;
      eq(job(s, jobId).stage, 'quote');
      eq(job(s, jobId).quote.sentAt, null);
    });
    t('워크플로', '작업 배정 → 자재·시공 단계', () => {
      const { s, jobId } = toWork();
      eq(job(s, jobId).stage, 'work');
      eq(job(s, jobId).assignments.length, 1);
    });
    t('워크플로', '자재 사용은 재고를 줄이고 같은 작업 예약을 소진한다', () => {
      let { s, jobId } = toWork();
      s = run(s, 'reserveMaterial', { jobId, materialId: 'm4', qty: 4, date: D(1) }).state;
      s = run(s, 'useMaterial', { jobId, materialId: 'm4', qty: 3 }).state;
      eq(mat(s, 'm4').stock, 9);
      const r = s.reservations.find((x) => x.jobId === jobId);
      eq([r.status, r.qty], ['reserved', 1]);
      s = run(s, 'useMaterial', { jobId, materialId: 'm4', qty: 1 }).state;
      eq(s.reservations.find((x) => x.jobId === jobId).status, 'used');
    });
    t('워크플로', '재고보다 많이 쓰면 INSUFFICIENT_STOCK', () => {
      const { s, jobId } = toWork();
      throwsCode(() => run(s, 'useMaterial', { jobId, materialId: 'm8', qty: 2 }), 'INSUFFICIENT_STOCK');
    });
    t('워크플로', '승인 없이 시공한 추가 작업이 있으면 완료 차단 (UNAPPROVED_CO)', () => {
      let { s, jobId } = toWork();
      s = run(s, 'addChangeOrder', { jobId, title: '추가', performed: true, items: [{ kind: 'labor', name: '공임', qty: 1, unit: '식', unitPrice: 50000 }] }).state;
      throwsCode(() => run(s, 'completeWork', { jobId }), 'UNAPPROVED_CO');
    });
    t('워크플로', '결정 안 된 추가 작업이 있으면 완료 차단 (PENDING_CO)', () => {
      let { s, jobId } = toWork();
      s = run(s, 'addChangeOrder', { jobId, title: '추가', items: [{ kind: 'labor', name: '공임', qty: 1, unit: '식', unitPrice: 50000 }] }).state;
      throwsCode(() => run(s, 'completeWork', { jobId }), 'PENDING_CO');
    });
    t('워크플로', '완료 시 남은 예약을 풀고 미래 배정을 정리한다', () => {
      let { s, jobId } = toWork(null, { date: TODAY });
      s = run(s, 'assignCrew', { jobId, crewId: 'c1', date: D(3), start: '09:00', end: '10:00' }).state;
      s = run(s, 'reserveMaterial', { jobId, materialId: 'm4', qty: 4, date: TODAY }).state;
      const r = run(s, 'completeWork', { jobId }, ctx('17:00'));
      s = r.state;
      eq(r.result.released, 1);
      eq(s.reservations.find((x) => x.jobId === jobId).status, 'released');
      eq(job(s, jobId).assignments.length, 1);
      eq(job(s, jobId).stage, 'settle');
    });
    t('워크플로', '청구서 기본 구성 = 견적 + 승인된 추가 작업 (거절 제외)', () => {
      let { s, jobId } = toWork();
      const li = (p) => [{ kind: 'labor', name: '공임', qty: 1, unit: '식', unitPrice: p }];
      let r = run(s, 'addChangeOrder', { jobId, title: '승인될 작업', items: li(100000) });
      s = r.state;
      s = run(s, 'approveChangeOrder', { jobId, coId: r.result.coId, method: '전화', by: '고객' }).state;
      r = run(s, 'addChangeOrder', { jobId, title: '거절될 작업', items: li(70000) });
      s = r.state;
      s = run(s, 'rejectChangeOrder', { jobId, coId: r.result.coId }).state;
      s = run(s, 'completeWork', { jobId }).state;
      s = run(s, 'issueInvoice', { jobId }).state;
      // 견적 26,000 + 250,000 + 추가 100,000 = 376,000 + 부가세 37,600
      eq(E.invoiceTotals(job(s, jobId)).total, 413600);
    });
    t('워크플로', '부분 수금은 잔액을 남기고 완납하면 종결된다', () => {
      let { s, jobId } = toWork();
      s = run(s, 'completeWork', { jobId }).state;
      s = run(s, 'issueInvoice', { jobId }).state;
      const total = E.invoiceTotals(job(s, jobId)).total;
      s = run(s, 'recordPayment', { jobId, amount: 100000 }).state;
      eq(E.invoiceTotals(job(s, jobId)).balance, total - 100000);
      eq(job(s, jobId).status, 'open');
      throwsCode(() => run(s, 'recordPayment', { jobId, amount: total }), 'OVERPAY');
      s = run(s, 'recordPayment', { jobId, amount: total - 100000 }).state;
      eq(job(s, jobId).status, 'closed');
    });
    t('워크플로', '접수부터 정산까지 한 번에 진행하면 경고 0건', () => {
      let { s, jobId } = toWork(null, { date: TODAY });
      s = run(s, 'reserveMaterial', { jobId, materialId: 'm4', qty: 4, date: TODAY }).state;
      s = run(s, 'useMaterial', { jobId, materialId: 'm4', qty: 4 }).state;
      const r = run(s, 'addChangeOrder', { jobId, title: '트랩 교체', items: [{ kind: 'material', name: 'P트랩 50A', materialId: 'm12', qty: 1, unit: '개', unitPrice: 15000 }] });
      s = r.state;
      s = run(s, 'approveChangeOrder', { jobId, coId: r.result.coId, method: '서명', by: '고객', signature: 'data:x' }).state;
      s = run(s, 'useMaterial', { jobId, materialId: 'm12', qty: 1, coId: r.result.coId }).state;
      s = run(s, 'completeWork', { jobId }).state;
      s = run(s, 'issueInvoice', { jobId }).state;
      s = run(s, 'recordPayment', { jobId, amount: E.invoiceTotals(job(s, jobId)).total }).state;
      eq(job(s, jobId).status, 'closed');
      eq(E.detect(s, TODAY).filter((f) => f.jobIds.includes(jobId)).length, 0, '이 작업의 경고 수');
    });
    t('워크플로', 'apply는 원래 상태를 바꾸지 않는다', () => {
      const s = E.buildSampleState(TODAY);
      const before = JSON.stringify(s);
      run(s, 'createJob', { customerName: 'a', address: 'b', title: 'c' });
      run(s, 'useMaterial', { jobId: s.jobs.find((j) => j.stage === 'work').id, materialId: 'm11', qty: 1 });
      eq(JSON.stringify(s) === before, true);
    });

    /* ── 추가 작업 승인 누락 ── */
    t('승인 누락', 'A1 승인 없이 시공 → 탐지, 승인하면 해소', () => {
      let { s, jobId } = toWork();
      const r = run(s, 'addChangeOrder', { jobId, title: '벽체 배관 추가', items: [{ kind: 'labor', name: '공임', qty: 1, unit: '식', unitPrice: 120000 }] });
      s = r.state;
      eq(count(s, 'A1'), 0);
      s = run(s, 'markPerformed', { jobId, coId: r.result.coId }).state;
      const f = E.detect(s, TODAY).find((x) => x.rule === 'A1');
      ok(f, 'A1 미탐지');
      eq([f.sev, f.amount, f.metric], ['critical', 132000, 'unapproved']);
      s = run(s, 'approveChangeOrder', { jobId, coId: r.result.coId, method: '전화', by: '고객' }).state;
      eq(count(s, 'A1'), 0);
    });
    t('승인 누락', 'A1 고객이 거절했는데 시공 기록이 있어도 탐지', () => {
      let { s, jobId } = toWork();
      const r = run(s, 'addChangeOrder', { jobId, title: 'x', performed: true, items: [{ kind: 'labor', name: '공임', qty: 1, unit: '식', unitPrice: 10000 }] });
      s = run(r.state, 'rejectChangeOrder', { jobId, coId: r.result.coId }).state;
      eq(count(s, 'A1'), 1);
    });
    t('승인 누락', 'A2 견적을 넘는 자재 사용 → 탐지, 추가 작업 등록·승인하면 해소', () => {
      let { s, jobId } = toWork();
      s = run(s, 'useMaterial', { jobId, materialId: 'm4', qty: 6 }).state;
      const f = E.detect(s, TODAY).find((x) => x.rule === 'A2');
      ok(f, 'A2 미탐지');
      eq(f.amount, E.withVat(2 * 6500));
      const r = run(s, 'addChangeOrder', { jobId, title: '배수관 연장', items: [{ kind: 'material', name: 'PVC 배수관 50A', materialId: 'm4', qty: 2, unit: 'm', unitPrice: 6500 }] });
      s = run(r.state, 'approveChangeOrder', { jobId, coId: r.result.coId, method: '문자', by: '고객' }).state;
      eq(count(s, 'A2'), 0);
    });
    t('승인 누락', 'A2 거절된 추가 작업 수량은 허용 범위에 들어가지 않는다', () => {
      let { s, jobId } = toWork();
      const r = run(s, 'addChangeOrder', { jobId, title: '연장', items: [{ kind: 'material', name: 'PVC', materialId: 'm4', qty: 2, unit: 'm', unitPrice: 6500 }] });
      s = run(r.state, 'rejectChangeOrder', { jobId, coId: r.result.coId }).state;
      s = run(s, 'useMaterial', { jobId, materialId: 'm4', qty: 6 }).state;
      eq(count(s, 'A2'), 1);
    });
    t('승인 누락', 'A3 결정 안 된 추가 작업이 남은 채 정산 단계 → 탐지', () => {
      let { s, jobId } = toWork();
      s = run(s, 'completeWork', { jobId }).state;
      const s2 = E.clone(s);
      job(s2, jobId).changeOrders.push({ id: 'CO999', title: '맨홀 보수', items: [{ id: 'I999', kind: 'labor', name: '공임', qty: 1, unit: '식', unitPrice: 50000 }], status: 'pending', performed: false });
      eq(count(s2, 'A3'), 1);
    });

    /* ── 자재 중복 예약 ── */
    t('자재 중복', 'M1 재고를 넘으면 작업일이 늦은 예약이 부족으로 잡힌다', () => {
      let a = toWork(null, { phone: '010-1' });
      let b = toWork(a.s, { phone: '010-2', crewId: 'c2' });
      let s = b.s;
      s = run(s, 'reserveMaterial', { jobId: a.jobId, materialId: 'm4', qty: 8, date: D(1) }).state;
      s = run(s, 'reserveMaterial', { jobId: b.jobId, materialId: 'm4', qty: 8, date: D(3), force: true }).state;
      const fs = E.detect(s, TODAY).filter((x) => x.rule === 'M1');
      eq(fs.length, 1);
      eq(fs[0].jobId, b.jobId);
      ok(fs[0].jobIds.includes(a.jobId), '먼저 예약한 작업이 함께 표시되어야 함');
      eq(fs[0].sev, 'warning', '3일 뒤 예약은 주의');
    });
    t('자재 중복', '예약 미리보기로 부족을 계산하고 강행 없이 저장하면 SHORTAGE', () => {
      let a = toWork(null, { phone: '010-1' });
      let s = run(a.s, 'reserveMaterial', { jobId: a.jobId, materialId: 'm4', qty: 10, date: D(1) }).state;
      const pv = E.reservationPreview(s, { materialId: 'm4', qty: 5, date: D(2), jobId: 'J?' });
      eq([pv.shortage, pv.available], [3, 2]);
      const b = toWork(s, { phone: '010-2', crewId: 'c2' });
      const e = throwsCode(() => run(b.s, 'reserveMaterial', { jobId: b.jobId, materialId: 'm4', qty: 5, date: D(2) }), 'SHORTAGE');
      eq(e.data.shortage, 3);
    });
    t('자재 중복', '앞선 날짜로 끼어들어 다른 작업을 부족하게 만들어도 SHORTAGE', () => {
      let a = toWork(null, { phone: '010-1' });
      let s = run(a.s, 'reserveMaterial', { jobId: a.jobId, materialId: 'm4', qty: 10, date: D(3) }).state;
      const b = toWork(s, { phone: '010-2', crewId: 'c2' });
      const e = throwsCode(() => run(b.s, 'reserveMaterial', { jobId: b.jobId, materialId: 'm4', qty: 5, date: D(1) }), 'SHORTAGE');
      eq(e.data.shortage, 0);
      eq(e.data.hurt.length, 1);
    });
    t('자재 중복', 'M2 같은 작업에 같은 자재 두 번 → 저장 차단, 강행 시 탐지, 합치면 해소', () => {
      let { s, jobId } = toWork();
      s = run(s, 'reserveMaterial', { jobId, materialId: 'm4', qty: 4, date: D(1) }).state;
      throwsCode(() => run(s, 'reserveMaterial', { jobId, materialId: 'm4', qty: 4, date: D(1) }), 'DUPLICATE_RESERVATION');
      s = run(s, 'reserveMaterial', { jobId, materialId: 'm4', qty: 4, date: D(1), allowDuplicate: true }).state;
      const f = E.detect(s, TODAY).find((x) => x.rule === 'M2');
      ok(f, 'M2 미탐지');
      s = run(s, 'mergeReservations', { ids: f.fix.ids, qty: 4 }).state;
      eq(count(s, 'M2'), 0);
      eq(s.reservations.filter((r) => r.status === 'reserved').length, 1);
    });
    t('자재 중복', '예약을 취소하거나 입고하면 M1 해소', () => {
      let a = toWork(null, { phone: '010-1' });
      let b = toWork(a.s, { phone: '010-2', crewId: 'c2' });
      let s = run(b.s, 'reserveMaterial', { jobId: a.jobId, materialId: 'm4', qty: 8, date: D(1) }).state;
      const r = run(s, 'reserveMaterial', { jobId: b.jobId, materialId: 'm4', qty: 8, date: D(2), force: true });
      s = r.state;
      eq(count(s, 'M1'), 1);
      eq(count(run(s, 'cancelReservation', { reservationId: r.result.reservationId }).state, 'M1'), 0);
      eq(count(run(s, 'restock', { materialId: 'm4', qty: 4 }).state, 'M1'), 0);
    });
    t('자재 중복', '사용(출고)된 예약은 활성 예약 합계에서 빠진다', () => {
      let { s, jobId } = toWork();
      s = run(s, 'reserveMaterial', { jobId, materialId: 'm4', qty: 4, date: D(1) }).state;
      s = run(s, 'useMaterial', { jobId, materialId: 'm4', qty: 4 }).state;
      const L = E.materialLedger(s).find((x) => x.material.id === 'm4');
      eq([L.reserved, L.available], [0, 8]);
    });

    /* ── 일정 충돌 ── */
    t('일정 충돌', 'C1 같은 팀 같은 날 겹치면 배정 차단, 강행 시 탐지', () => {
      let a = toWork(null, { phone: '010-1', start: '09:00', end: '12:00' });
      const b = toWork(a.s, { phone: '010-2', noAssign: true });
      const e = throwsCode(() => run(b.s, 'assignCrew', { jobId: b.jobId, crewId: 'c1', date: D(1), start: '11:00', end: '14:00' }), 'SCHEDULE_CONFLICT');
      eq(e.data.conflicts.length, 1);
      const s = run(b.s, 'assignCrew', { jobId: b.jobId, crewId: 'c1', date: D(1), start: '11:00', end: '14:00', force: true }).state;
      const f = E.detect(s, TODAY).find((x) => x.rule === 'C1');
      ok(f, 'C1 미탐지');
      eq(f.jobIds.length, 2);
    });
    t('일정 충돌', '다른 팀이면 같은 시간이어도 충돌 아님', () => {
      let a = toWork(null, { phone: '010-1' });
      const b = toWork(a.s, { phone: '010-2', crewId: 'c2' });
      eq(count(b.s, 'C1'), 0);
    });
    t('일정 충돌', '끝과 시작이 맞닿으면 겹침 아님, 주소가 다르면 이동 시간 부족(C2)', () => {
      let a = toWork(null, { phone: '010-1', start: '09:00', end: '12:00', address: '가 1' });
      const b = toWork(a.s, { phone: '010-2', start: '12:00', end: '14:00', address: '나 2' });
      eq(count(b.s, 'C1'), 0);
      eq(count(b.s, 'C2'), 1, '0분 간격');
      const b2 = toWork(a.s, { phone: '010-4', start: '12:10', end: '14:00', address: '라 4' });
      eq(count(b2.s, 'C2'), 1, '10분 간격');
      const b3 = toWork(a.s, { phone: '010-5', start: '12:00', end: '14:00', address: '가 1' });
      eq(count(b3.s, 'C2'), 0, '같은 주소면 이동 없음');
      const c = toWork(a.s, { phone: '010-3', start: '12:30', end: '14:00', address: '다 3' });
      eq(count(c.s, 'C2'), 0, '30분 간격이면 정상');
    });
    t('일정 충돌', '현장 확인 방문도 충돌 검사에 포함된다', () => {
      let a = toWork(null, { phone: '010-1', crewId: 'c3', start: '10:00', end: '12:00' });
      const r = run(a.s, 'createJob', { customerName: 'b', phone: '010-2', address: 'x', title: 'y' });
      throwsCode(() => run(r.state, 'scheduleSurvey', { jobId: r.result.jobId, crewId: 'c3', date: D(1), start: '11:00', end: '11:30' }), 'SCHEDULE_CONFLICT');
    });
    t('일정 충돌', '지난 날짜 일정은 충돌 탐지에서 제외', () => {
      let a = toWork(null, { phone: '010-1', date: D(-2) });
      const b = toWork(a.s, { phone: '010-2', date: D(-2), force: true });
      eq(count(b.s, 'C1'), 0);
    });
    t('일정 충돌', '다른 시간으로 옮기면 충돌 해소', () => {
      let a = toWork(null, { phone: '010-1', start: '09:00', end: '12:00' });
      let b = toWork(a.s, { phone: '010-2', start: '10:00', end: '11:00', force: true });
      const f = E.detect(b.s, TODAY).find((x) => x.rule === 'C1');
      const s = run(b.s, 'updateSlot', { jobId: f.fix.jobId, entryId: f.fix.entryId, crewId: 'c2', date: D(1), start: '10:00', end: '11:00' }).state;
      eq(count(s, 'C1'), 0);
    });
    t('일정 충돌', '시작이 종료보다 늦으면 INVALID', () => {
      const { s, jobId } = toWork(null, { noAssign: true });
      throwsCode(() => run(s, 'assignCrew', { jobId, crewId: 'c1', date: D(1), start: '15:00', end: '14:00' }), 'INVALID');
    });

    /* ── 청구 누락 ── */
    t('청구 누락', 'B1 완료 당일은 없음, 1일 경과 주의, 7일 경과 심각', () => {
      let { s, jobId } = toWork();
      s = run(s, 'completeWork', { jobId }).state;
      eq(count(s, 'B1', TODAY), 0);
      eq(E.detect(s, D(1)).find((f) => f.rule === 'B1').sev, 'warning');
      eq(E.detect(s, D(7)).find((f) => f.rule === 'B1').sev, 'critical');
      s = run(s, 'issueInvoice', { jobId }).state;
      eq(count(s, 'B1', D(7)), 0);
    });
    t('청구 누락', 'B2 승인된 추가 작업이 빠진 청구서 → 탐지, 청구서에 추가하면 해소', () => {
      let { s, jobId } = toWork();
      const r = run(s, 'addChangeOrder', { jobId, title: '보온재', items: [{ kind: 'labor', name: '보온 공임', qty: 1, unit: '식', unitPrice: 40000 }] });
      s = run(r.state, 'approveChangeOrder', { jobId, coId: r.result.coId, method: '전화', by: '고객' }).state;
      s = run(s, 'completeWork', { jobId }).state;
      const quoteKeys = E.expectedLines(job(s, jobId)).filter((l) => l.source === 'quote').map((l) => l.key);
      s = run(s, 'issueInvoice', { jobId, keys: quoteKeys }).state;
      const f = E.detect(s, TODAY).find((x) => x.rule === 'B2');
      ok(f, 'B2 미탐지');
      eq(f.amount, 44000);
      s = run(s, 'addInvoiceLines', { jobId, keys: f.fix.keys }).state;
      eq(count(s, 'B2'), 0);
    });
    t('청구 누락', 'B2 견적 항목이 빠진 청구서도 탐지', () => {
      let { s, jobId } = toWork();
      s = run(s, 'completeWork', { jobId }).state;
      const keys = E.expectedLines(job(s, jobId)).map((l) => l.key);
      s = run(s, 'issueInvoice', { jobId, keys: keys.slice(0, 1) }).state;
      const f = E.detect(s, TODAY).find((x) => x.rule === 'B2');
      ok(f && /견적 항목 1개/.test(f.detail), 'B2(견적) 미탐지');
    });
    t('청구 누락', 'B3 사용 자재 미청구 (B2로 잡힌 수량은 이중 집계 안 함)', () => {
      let { s, jobId } = toWork();
      const r = run(s, 'addChangeOrder', { jobId, title: '연장', items: [{ kind: 'material', name: 'PVC', materialId: 'm4', qty: 2, unit: 'm', unitPrice: 6500 }] });
      s = run(r.state, 'approveChangeOrder', { jobId, coId: r.result.coId, method: '문자', by: '고객' }).state;
      s = run(s, 'useMaterial', { jobId, materialId: 'm4', qty: 7 }).state; // 견적 4 + 추가 2 = 6, 1m 초과
      s = run(s, 'completeWork', { jobId }).state;
      const quoteKeys = E.expectedLines(job(s, jobId)).filter((l) => l.source === 'quote').map((l) => l.key);
      s = run(s, 'issueInvoice', { jobId, keys: quoteKeys }).state; // 추가 작업 2m 누락
      const fs = E.detect(s, TODAY);
      eq(fs.filter((f) => f.rule === 'B2').length, 1);
      const b3 = fs.find((f) => f.rule === 'B3');
      ok(b3, 'B3 미탐지');
      eq(b3.fix.qty, 1, 'B2로 잡힌 2m는 빼고 1m만');
      s = run(s, 'addInvoiceLines', { jobId, extra: [{ materialId: 'm4', qty: 1 }] }).state;
      eq(count(s, 'B3'), 0);
    });
    t('청구 누락', 'B4 수금 기한 경과 → 탐지, 15일 이상 심각, 완납하면 해소', () => {
      let { s, jobId } = toWork();
      s = run(s, 'completeWork', { jobId }).state;
      s = run(s, 'issueInvoice', { jobId, dueDays: 14 }).state;
      eq(count(s, 'B4', D(14)), 0);
      eq(E.detect(s, D(15)).find((f) => f.rule === 'B4').sev, 'warning');
      eq(E.detect(s, D(29)).find((f) => f.rule === 'B4').sev, 'critical');
      s = run(s, 'recordPayment', { jobId, amount: E.invoiceTotals(job(s, jobId)).balance }).state;
      eq(count(s, 'B4', D(29)), 0);
    });
    t('청구 누락', 'B5 마지막 작업일이 지났는데 시공 단계면 탐지', () => {
      const { s } = toWork(null, { date: TODAY });
      eq(count(s, 'B5', TODAY), 0);
      eq(count(s, 'B5', D(1)), 1);
    });

    /* ── 예시 데이터·운영 ── */
    t('예시 데이터', '규칙별 탐지 건수가 설계와 같다', () => {
      const s = E.buildSampleState(TODAY);
      const c = {};
      for (const r of rules(s).sort()) c[r] = (c[r] || 0) + 1;
      eq(c, { A1: 1, A2: 2, A3: 1, B1: 1, B2: 1, B3: 1, B4: 1, B5: 1, C1: 1, C2: 1, M1: 2, M2: 1 });
    });
    t('예시 데이터', '날짜를 바꿔 만들어도 탐지 결과가 같다', () => {
      const a = rules(E.buildSampleState('2026-01-30'), '2026-01-30').sort();
      const b = rules(E.buildSampleState('2027-03-01'), '2027-03-01').sort();
      eq(a, b);
    });
    t('예시 데이터', '정상 종결된 작업은 경고 0건', () => {
      const s = E.buildSampleState(TODAY);
      const closed = s.jobs.filter((j) => j.status === 'closed').map((j) => j.id);
      eq(closed.length, 2);
      eq(E.detect(s, TODAY).filter((f) => f.jobIds.some((id) => closed.includes(id))).length, 0);
    });
    t('예시 데이터', '금액 요약은 개별 경고 금액의 합', () => {
      const s = E.buildSampleState(TODAY);
      const fs = E.detect(s, TODAY);
      const sum = E.summarize(fs);
      const manual = fs.filter((f) => f.metric === 'unbilled').reduce((a, f) => a + f.amount, 0);
      eq(sum.money.unbilled, manual);
      ok(sum.money.unapproved > 0 && sum.money.overdue > 0, '세 금액 모두 0보다 커야 함');
    });
    t('예시 데이터', '확인 처리한 경고는 열린 목록에서 빠지고 해제하면 돌아온다', () => {
      let s = E.buildSampleState(TODAY);
      const f = E.detect(s, TODAY).find((x) => x.rule === 'C2');
      s = run(s, 'ack', { key: f.key, note: '같은 단지, 도보 이동' }).state;
      let sp = E.splitAcked(s, E.detect(s, TODAY));
      eq([sp.open.length, sp.acked.length], [13, 1]);
      s = run(s, 'unack', { key: f.key }).state;
      sp = E.splitAcked(s, E.detect(s, TODAY));
      eq(sp.open.length, 14);
    });
    return T;
  }

  function runAll(E) {
    const tests = define(E);
    const results = [];
    for (const tc of tests) {
      const t0 = Date.now();
      try {
        tc.fn();
        results.push({ group: tc.group, name: tc.name, pass: true, ms: Date.now() - t0 });
      } catch (e) {
        results.push({ group: tc.group, name: tc.name, pass: false, ms: Date.now() - t0, error: e && e.message ? e.message : String(e) });
      }
    }
    return results;
  }

  return { define, runAll };
});

</script>
<script>
/* 누수제로 화면 — 엔진(NusuEngine) 위에서 동작하는 단일 페이지 앱 */
(function () {
  'use strict';
  const E = window.NusuEngine;
  const TESTS = window.NusuTests;
  const LS_KEY = 'nusuzero.v1';
  const pad2 = (n) => String(n).padStart(2, '0');

  /* ───────── 상태 ───────── */
  function localToday() {
    if (window.__NUSU_TODAY) return window.__NUSU_TODAY;
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  }
  function nowStamp() {
    const d = new Date();
    const hm = window.__NUSU_TIME || `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    return `${TODAY} ${hm}`;
  }
  const TODAY = localToday();
  function load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (s && s.version === 1 && Array.isArray(s.jobs)) return s;
    } catch (e) {
      /* 저장소를 쓸 수 없으면 예시 데이터로 시작 */
    }
    return null;
  }
  function save() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(S));
    } catch (e) {
      /* 저장 실패는 무시: 메모리 상태로 계속 동작 */
    }
  }
  let S = load() || E.buildSampleState(TODAY);
  const ui = { view: 'home', jobId: null, stageFilter: 'open', q: '', auditCat: 'all', weekOffset: 0, day: TODAY, openMat: null, hiRes: null, tests: null };
  const ctx = () => ({ now: nowStamp(), today: TODAY, user: '사무실' });

  /* ───────── 작은 도구 ───────── */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const won = E.won;
  const fq = E.fq;
  const job = (id) => E.byId(S.jobs, id);
  const cust = (id) => E.byId(S.customers, id) || { name: '-', phone: '', address: '' };
  const crew = (id) => E.byId(S.crews, id) || { name: '-', lead: '' };
  const mat = (id) => E.byId(S.materials, id);
  const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  function relDay(ds) {
    const d = E.diffDays(ds, TODAY);
    if (d === 0) return '오늘';
    if (d === 1) return '내일';
    if (d === 2) return '모레';
    if (d === -1) return '어제';
    return E.md(ds);
  }
  const dt = (s) => (s ? `${E.md(s.slice(0, 10))} ${s.slice(11, 16)}` : '');
  function longDate(ds) {
    const [y, m, d] = ds.split('-').map(Number);
    return `${y}년 ${m}월 ${d}일 ${WEEK[E.dow(ds)]}요일`;
  }

  const P = 'xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="i" aria-hidden="true"';
  const I = {
    home: `<svg ${P}><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-5h4v5"/></svg>`,
    jobs: `<svg ${P}><path d="M4 7h16v12H4z"/><path d="M9 7V5h6v2"/><path d="M4 12h16"/></svg>`,
    cal: `<svg ${P}><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>`,
    box: `<svg ${P}><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></svg>`,
    drop: `<svg ${P}><path d="M12 3.5c-3 4-6 7.2-6 10.5a6 6 0 0 0 12 0c0-3.3-3-6.5-6-10.5z"/></svg>`,
    flask: `<svg ${P}><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M7.5 14h9"/></svg>`,
    plus: `<svg ${P}><path d="M12 5v14M5 12h14"/></svg>`,
    more: `<svg ${P}><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>`,
    check: `<svg ${P}><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
    x: `<svg ${P}><path d="M6 6l12 12M18 6L6 18"/></svg>`,
    left: `<svg ${P}><path d="M15 5l-7 7 7 7"/></svg>`,
    right: `<svg ${P}><path d="M9 5l7 7-7 7"/></svg>`,
    search: `<svg ${P}><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>`,
    reset: `<svg ${P}><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4h4"/></svg>`,
  };
  const DROP_FILL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8c-3.2 4.3-6.5 7.8-6.5 11.4a6.5 6.5 0 0 0 13 0c0-3.6-3.3-7.1-6.5-11.4z"/></svg>';

  /** 미리보기 상자는 내용이 바뀔 때만 다시 그린다 (누르려던 버튼이 클릭 도중 사라지지 않도록) */
  function setHTML(el, html) {
    if (el.__html !== html) {
      el.innerHTML = html;
      el.__html = html;
    }
  }
  function toast(msg) {
    const root = $('#toast-root');
    root.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(() => el.remove(), 2800);
  }

  /* ───────── 계산 묶음 ───────── */
  function findings() {
    const all = E.detect(S, TODAY);
    return Object.assign(E.splitAcked(S, all), { all });
  }
  function nextStep(j) {
    if (j.status === 'canceled') return { t: '취소됨', s: j.canceledReason };
    if (j.status === 'closed') return { t: '정산 완료', s: j.closedAt ? dt(j.closedAt) : '' };
    switch (j.stage) {
      case 'inquiry':
        return { t: '현장 확인 일정 잡기', s: `접수 ${dt(j.createdAt)}` };
      case 'survey':
        return { t: `현장 확인 ${relDay(j.survey.date)} ${j.survey.start}`, s: crew(j.survey.crewId).name };
      case 'quote':
        return { t: j.quote.items.length ? '견적 발송' : '견적 작성', s: j.quote.items.length ? `작성 중 ${won(E.quoteTotals(j).total)}` : '항목 없음' };
      case 'approval':
        return { t: '고객 승인 대기', s: `발송 ${E.diffDays(TODAY, j.quote.sentAt.slice(0, 10))}일째 · ${j.quote.sentVia}` };
      case 'schedule':
        return { t: '작업팀 배정', s: `승인 ${dt(j.approval.at)}` };
      case 'work': {
        const up = j.assignments.filter((a) => a.date >= TODAY).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start))[0];
        if (up) return { t: `시공 ${relDay(up.date)} ${up.start}~${up.end}`, s: crew(up.crewId).name };
        return { t: '완료 처리', s: '작업일 지남' };
      }
      case 'settle': {
        if (!j.invoice) return { t: '청구서 발행', s: `완료 ${dt(j.completedAt)}` };
        const it = E.invoiceTotals(j);
        return { t: '수금 대기', s: `잔액 ${won(it.balance)} · 기한 ${E.md(j.invoice.dueDate)}` };
      }
    }
    return { t: '', s: '' };
  }
  function jobAmount(j) {
    if (j.invoice) return E.invoiceTotals(j).total;
    const t = E.expectedTotal(j);
    return t || null;
  }
  function sevCounts(list) {
    const c = { critical: 0, warning: 0 };
    for (const f of list) c[f.sev] = (c[f.sev] || 0) + 1;
    return c;
  }
  function dropBadges(c) {
    let h = '';
    if (c.critical) h += `<span class="drop crit" title="심각 ${c.critical}건">${DROP_FILL}${c.critical}</span>`;
    if (c.warning) h += `<span class="drop warn" title="주의 ${c.warning}건">${DROP_FILL}${c.warning}</span>`;
    return h;
  }
  function stageLabel(j) {
    if (j.status === 'closed') return '정산 완료';
    if (j.status === 'canceled') return '취소';
    return E.STAGES[E.STAGE_INDEX[j.stage]].label;
  }
  function miniPipe(j) {
    const idx = j.status === 'closed' ? 7 : E.STAGE_INDEX[j.stage];
    return `<span class="mini" aria-hidden="true">${E.STAGES.map((_, i) => `<i class="${i <= idx && j.status !== 'canceled' ? 'on' : ''}"></i>`).join('')}</span>`;
  }

  /* ───────── 배관 단계 띠 ───────── */
  function pipeProgress(j) {
    const cur = j.status === 'closed' ? 7 : E.STAGE_INDEX[j.stage];
    return `<ol class="pipe" aria-label="작업 단계">${E.STAGES.map((st, i) => {
      const cls = i < cur ? 'done' : i === cur ? 'cur' : '';
      const flow = i <= cur && i > 0 ? ' flow' : '';
      const state = i < cur ? '완료' : i === cur ? '진행 중' : '대기';
      return `<li class="${cls}${flow}" ${i === cur ? 'aria-current="step"' : ''}><span class="valve">${i < cur ? I.check : ''}</span><span class="lbl"><span class="lbl-l">${st.label}</span><span class="lbl-s">${st.short}</span></span><span class="sr">${state}</span></li>`;
    }).join('')}</ol>`;
  }
  function pipeCounts(sel) {
    const open = S.jobs.filter((j) => j.status === 'open');
    return `<ol class="pipe count" aria-label="단계별 진행 중 작업 수">${E.STAGES.map((st, i) => {
      const n = open.filter((j) => j.stage === st.key).length;
      const cls = (n ? '' : 'zero') + (sel === st.key ? ' sel' : '');
      return `<li class="${i > 0 ? 'flow' : ''}"><button type="button" class="joint ${cls}" data-act="stage" data-v="${st.key}" aria-pressed="${sel === st.key}"><span class="valve">${n}</span><span class="lbl"><span class="lbl-l">${st.label}</span><span class="lbl-s">${st.short}</span></span></button></li>`;
    }).join('')}</ol>`;
  }

  /* ───────── 경고 한 줄 ───────── */
  const FIX_LABEL = {
    approveCO: '고객 승인 받기',
    addCO: '추가 작업으로 등록',
    issueInvoice: '청구서 발행',
    addInvoiceLines: '청구서에 추가',
    addExtraLine: '청구서에 추가',
    payment: '수금 기록',
    complete: '작업 열기',
    material: '자재 보기',
    mergeReservations: '예약 합치기',
    reschedule: '일정 옮기기',
  };
  function findingRow(f, opt = {}) {
    const j = job(f.jobId);
    const others = f.jobIds.filter((id) => id !== f.jobId);
    const links = opt.noJob
      ? others.map((id) => `<a href="#job-${id}">${esc(job(id).title)}</a>`).join('')
      : f.jobIds.map((id) => `<a href="#job-${id}">${esc(job(id).code)} ${esc(job(id).title)}</a>`).join('');
    const amt = f.amount != null ? `<div class="amt">${won(f.amount)}<small>${f.metric === 'unapproved' ? '승인 미확보' : f.metric === 'unbilled' ? '청구 누락' : f.metric === 'overdue' ? '기한 지난 미수' : '청구 대기'}</small></div>` : '<div class="amt"></div>';
    const fixBtn = f.fix && FIX_LABEL[f.fix.type] && !opt.acked ? `<button type="button" class="btn sm ${f.sev === 'critical' ? 'primary' : ''}" data-act="fix" data-key="${esc(f.key)}">${FIX_LABEL[f.fix.type]}</button>` : '';
    const ackBtn = opt.acked
      ? `<button type="button" class="btn sm ghost" data-act="unack" data-key="${esc(f.key)}">다시 열기</button>`
      : `<button type="button" class="btn sm ghost" data-act="ack" data-key="${esc(f.key)}">확인함</button>`;
    const ackNote = opt.acked && S.acks[f.key] ? `<div class="dt">확인 ${dt(S.acks[f.key].at)}${S.acks[f.key].note ? ' · ' + esc(S.acks[f.key].note) : ''}</div>` : '';
    return `<div class="fd ${opt.acked ? 'acked' : f.sev} ${opt.compact ? 'compact' : ''}" data-rule="${f.rule}">
      <div class="dr">${DROP_FILL}</div>
      <div>
        <div class="tt"><span class="rc">${f.rule}</span><b>${esc(f.title)}</b><span class="pill ${f.sev === 'critical' ? 'crit' : 'warn'}">${E.SEV_LABEL[f.sev]}</span></div>
        <div class="dt">${esc(f.detail)}</div>${ackNote}
        ${links ? `<div class="jl">${opt.noJob && links ? '함께 걸린 작업 ' : ''}${links}</div>` : ''}
      </div>
      ${amt}
      <div class="act">${fixBtn}${ackBtn}</div>
    </div>`;
  }

  /* ───────── 화면: 홈 ───────── */
  function viewHome() {
    const F = findings();
    const sum = E.summarize(F.open);
    const open = S.jobs.filter((j) => j.status === 'open');
    const todayEntries = E.scheduleEntries(S).filter((e) => e.date === TODAY && job(e.jobId).status === 'open');
    const flagged = flagMap(F.open);
    const cats = E.CAT_ORDER.map((c) => {
      const b = sum.byCat[c];
      return `<button type="button" data-act="goAudit" data-v="${c}"><span class="n ${b.total ? '' : 'zero'}">${b.total}</span><span class="lb">${E.CATS[c].label}</span><span class="sv">${dropBadges(b)}${b.total ? '' : '<span class="muted" style="font-size:12px">이상 없음</span>'}</span></button>`;
    }).join('');
    const crews = S.crews
      .map((c) => {
        const list = todayEntries.filter((e) => e.crewId === c.id).sort((a, b) => E.toMin(a.start) - E.toMin(b.start));
        if (!list.length) return '';
        return `<div class="agenda-crew"><h3>${esc(c.name)} <span class="muted" style="font-weight:500">${esc(c.members.join('·'))}</span></h3>${list.map((e) => slotRow(e, flagged)).join('')}</div>`;
      })
      .join('');
    const top = F.open.slice(0, 5).map((f) => findingRow(f, { compact: true })).join('');
    const since = E.addDays(TODAY, -29);
    let billed = 0;
    let paid = 0;
    let outstanding = 0;
    for (const j of S.jobs) {
      if (!j.invoice) continue;
      const it = E.invoiceTotals(j);
      if (j.invoice.issuedAt.slice(0, 10) >= since) billed += it.total;
      for (const p of j.invoice.payments) if (p.at.slice(0, 10) >= since) paid += p.amount;
      outstanding += it.balance;
    }
    return `
      <header class="ph"><div><h1>오늘 현장</h1><p>${longDate(TODAY)} · 진행 중 작업 ${open.length}건 · 오늘 일정 ${todayEntries.length}건</p></div>
        <div class="ph-act"><button type="button" class="btn primary" data-act="newJob">${I.plus}새 문의 접수</button></div></header>
      <div class="stack">
        <section class="panel" aria-labelledby="leak-h">
          <div class="leak-head"><h2 id="leak-h">${DROP_FILL}누수 점검 · 열린 경고 ${sum.total}건</h2><a href="#audit" class="btn sm">전체 경고 보기</a></div>
          <div class="leak">
            <div class="leak-money">
              ${moneyCell('승인 미확보', sum.money.unapproved, '고객 승인 없이 한 작업·자재', 'crit')}
              ${moneyCell('청구 누락', sum.money.unbilled, '청구서에 안 들어간 금액', 'crit')}
              ${moneyCell('기한 지난 미수', sum.money.overdue, '지급 기한이 지난 잔액', 'warn')}
            </div>
            <div class="leak-cats">${cats}</div>
          </div>
        </section>
        <section class="panel" aria-labelledby="flow-h">
          <div class="panel-h"><h2 id="flow-h">단계별 진행 중 작업</h2><span class="aside">최근 30일 청구 ${won(billed)} · 수금 ${won(paid)} · 미수 잔액 ${won(outstanding)}</span></div>
          <div class="panel-b" style="padding-top:18px">${pipeCounts(null)}</div>
        </section>
        <div class="grid2">
          <section class="panel" aria-labelledby="ag-h"><div class="panel-h"><h2 id="ag-h">오늘 일정</h2><a href="#schedule" class="aside">주간 일정</a></div>
            <div class="panel-b flush"><div class="agenda">${crews || '<p class="empty">오늘 잡힌 일정이 없습니다</p>'}</div></div></section>
          <section class="panel" aria-labelledby="tp-h"><div class="panel-h"><h2 id="tp-h">먼저 처리할 경고</h2><a href="#audit" class="aside">${F.open.length}건 모두 보기</a></div>
            <div class="panel-b flush">${top || '<p class="empty">열린 경고가 없습니다</p>'}</div></section>
        </div>
      </div>`;
  }
  function moneyCell(k, v, h, tone) {
    const [n, unit] = splitWon(v);
    return `<div class="money ${v ? tone : ''}"><div class="v">${n}<small>${unit}</small></div><div class="k">${k}</div><div class="h">${h}</div></div>`;
  }
  function splitWon(v) {
    if (v >= 10000) {
      const man = v / 10000;
      return [man >= 100 ? Math.round(man).toLocaleString('ko-KR') : (Math.round(man * 10) / 10).toLocaleString('ko-KR'), '만원'];
    }
    return [Math.round(v).toLocaleString('ko-KR'), '원'];
  }
  function flagMap(list) {
    const m = {};
    for (const f of list) {
      if (!f.entryIds) continue;
      for (const id of f.entryIds) m[id] = f.rule === 'C1' ? 'conflict' : m[id] || 'tight';
    }
    return m;
  }
  function slotRow(e, flagged) {
    const j = job(e.jobId);
    const fl = flagged[e.id];
    return `<a class="slot ${fl || ''}" href="#job-${j.id}"><span class="t">${e.start}–${e.end}</span><span class="w"><b>${esc(j.title)}</b><span>${e.kind === 'survey' ? '현장 확인 · ' : ''}${esc(j.address)}</span></span>${fl === 'conflict' ? '<span class="pill crit">겹침</span>' : fl === 'tight' ? '<span class="pill warn">이동 촉박</span>' : ''}</a>`;
  }

  /* ───────── 화면: 작업 목록 ───────── */
  function viewJobs() {
    const F = findings();
    const open = S.jobs.filter((j) => j.status === 'open');
    const flaggedIds = new Set(F.open.flatMap((f) => [f.jobId]));
    const chip = (v, label, n) => `<button type="button" class="chip" data-act="stage" data-v="${v}" aria-pressed="${ui.stageFilter === v}">${label}<span class="c">${n}</span></button>`;
    return `
      <header class="ph"><div><h1>작업</h1><p>문의부터 정산까지 모든 작업 건 · 단계를 누르면 걸러 봅니다</p></div>
        <div class="ph-act"><button type="button" class="btn primary" data-act="newJob">${I.plus}새 문의 접수</button></div></header>
      <section class="panel" style="margin-bottom:16px"><div class="panel-b" style="padding-top:18px">${pipeCounts(E.STAGE_INDEX[ui.stageFilter] != null ? ui.stageFilter : null)}</div></section>
      <div class="toolbar">
        <label class="search"><span class="sr">작업 검색</span>${I.search}<input id="q" type="text" placeholder="고객, 주소, 작업명, 접수번호" value="${esc(ui.q)}" autocomplete="off"></label>
        <div class="chips" role="group" aria-label="목록 범위">
          ${chip('open', '진행 중', open.length)}${chip('flag', '경고 있음', S.jobs.filter((j) => flaggedIds.has(j.id)).length)}${chip('closed', '정산 완료', S.jobs.filter((j) => j.status === 'closed').length)}${chip('all', '전체', S.jobs.length)}
        </div>
      </div>
      <section class="panel" id="jobs-list">${jobsList(F)}</section>`;
  }
  function jobsList(F) {
    F = F || findings();
    const byJob = {};
    for (const f of F.open) (byJob[f.jobId] = byJob[f.jobId] || []).push(f);
    const q = ui.q.trim().toLowerCase();
    let list = S.jobs.slice();
    const sf = ui.stageFilter;
    if (sf === 'open') list = list.filter((j) => j.status === 'open');
    else if (sf === 'closed') list = list.filter((j) => j.status === 'closed');
    else if (sf === 'flag') list = list.filter((j) => byJob[j.id]);
    else if (E.STAGE_INDEX[sf] != null) list = list.filter((j) => j.status === 'open' && j.stage === sf);
    if (q) list = list.filter((j) => [j.title, j.code, j.address, cust(j.customerId).name, j.issue].join(' ').toLowerCase().includes(q));
    list.sort((a, b) => (byJob[b.id] ? sevCounts(byJob[b.id]).critical * 10 + byJob[b.id].length : 0) - (byJob[a.id] ? sevCounts(byJob[a.id]).critical * 10 + byJob[a.id].length : 0) || E.STAGE_INDEX[a.stage] - E.STAGE_INDEX[b.stage] || b.createdAt.localeCompare(a.createdAt));
    if (!list.length) return `<p class="empty">조건에 맞는 작업이 없습니다${q ? ` · '${esc(ui.q)}' 검색 결과 없음` : ''}</p>`;
    return (
      `<div class="jlist-h" aria-hidden="true"><span>작업</span><span>고객 · 주소</span><span>단계</span><span>다음 할 일</span><span style="text-align:right">금액</span><span style="text-align:right">경고</span></div>` +
      list
        .map((j) => {
          const c = cust(j.customerId);
          const nx = nextStep(j);
          const amt = jobAmount(j);
          return `<a class="jrow" href="#job-${j.id}" data-job="${j.id}">
          <span class="ttl"><span class="code">${esc(j.code)}</span><b>${esc(j.title)}</b></span>
          <span class="who"><b>${esc(c.name)}</b><span>${esc(j.address)}</span></span>
          <span class="stg">${miniPipe(j)}<span>${stageLabel(j)}</span></span>
          <span class="nx">${esc(nx.t)}<span>${esc(nx.s)}</span></span>
          <span class="amt">${amt ? won(amt) : '<span class="muted">-</span>'}</span>
          <span class="flg">${byJob[j.id] ? dropBadges(sevCounts(byJob[j.id])) : ''}</span>
        </a>`;
        })
        .join('')
    );
  }

  /* ───────── 화면: 작업 상세 ───────── */
  function viewJob() {
    const j = job(ui.jobId);
    if (!j) return `<a class="back" href="#jobs">${I.left}작업 목록</a><p class="empty">작업을 찾을 수 없습니다</p>`;
    const c = cust(j.customerId);
    const F = findings();
    const mine = F.open.filter((f) => f.jobIds.includes(j.id));
    const amt = jobAmount(j);
    return `
      <a class="back" href="#jobs">${I.left}작업 목록</a>
      <header class="jd-head">
        <div style="min-width:0">
          <div class="meta"><span class="code">${esc(j.code)}</span><span>${esc(j.channel)} 접수 · ${dt(j.createdAt)}</span><span class="pill ${j.status === 'closed' ? 'ok' : j.status === 'canceled' ? '' : 'water'}">${stageLabel(j)}</span></div>
          <h1>${esc(j.title)}</h1>
          <div class="who"><b>${esc(c.name)}</b><span class="tnum">${esc(c.phone)}</span><span>${esc(j.address)}</span></div>
        </div>
        <div class="fig"><div class="v">${amt ? won(amt) : '-'}</div><div class="k">${j.invoice ? '청구 금액 (부가세 포함)' : '견적 + 승인된 추가 작업 (부가세 포함)'}</div></div>
      </header>
      <div class="pipe-wrap">${pipeProgress(j)}</div>
      <div class="jd">
        <div class="jd-main">
          ${nowCard(j, mine)}
          ${secSurvey(j)}
          ${secQuote(j)}
          ${secApproval(j)}
          ${secSchedule(j, F)}
          ${secMaterials(j)}
          ${secCO(j)}
          ${secSettle(j)}
        </div>
        <aside class="jd-side">
          <section class="panel"><div class="panel-h"><h2>문의 내용</h2></div><div class="panel-b"><p class="quote">${esc(j.issue || '내용 없음')}</p></div></section>
          <section class="panel"><div class="panel-h"><h2>처리 이력</h2><span class="aside">${j.history.length}건</span></div><div class="panel-b"><ol class="hist">${j.history
            .slice()
            .reverse()
            .map((h) => `<li><div><div class="when">${dt(h.at)} · ${esc(h.by)}</div><div class="what">${esc(h.text)}</div></div></li>`)
            .join('')}</ol></div></section>
          ${j.status === 'open' && !j.invoice ? `<button type="button" class="btn ghost" data-act="cancelJob" data-job="${j.id}">이 작업 취소</button>` : ''}
        </aside>
      </div>`;
  }
  function nowCard(j, mine) {
    let hint;
    let acts = '';
    const b = (act, label, cls = '') => `<button type="button" class="btn ${cls}" data-act="${act}" data-job="${j.id}">${label}</button>`;
    if (j.status === 'closed') hint = '청구한 금액을 모두 받았습니다.';
    else if (j.status === 'canceled') hint = `취소된 작업입니다 · ${j.canceledReason}`;
    else {
      hint = E.STAGES[E.STAGE_INDEX[j.stage]].next;
      switch (j.stage) {
        case 'inquiry':
          acts = b('survey', '현장 확인 일정 잡기', 'primary') + b('surveyRecord', '방문 없이 바로 기록');
          break;
        case 'survey':
          acts = b('surveyRecord', '현장 확인 결과 기록', 'primary') + b('survey', '방문 일정 변경');
          break;
        case 'quote':
          acts = b('quote', j.quote.items.length ? '견적 고치기' : '견적 작성', j.quote.items.length ? '' : 'primary') + (j.quote.items.length ? b('sendQuote', '견적 발송', 'primary') : '');
          break;
        case 'approval':
          acts = b('approve', '고객 승인 받기', 'primary') + b('quote', '견적 고치기') + b('decline', '고객이 거절함');
          break;
        case 'schedule':
          acts = b('assign', '작업팀 배정', 'primary') + b('reserve', '자재 예약') + b('co', '추가 작업 등록');
          break;
        case 'work':
          acts = b('use', '자재 사용 기록', 'primary') + b('co', '추가 작업 등록') + b('reserve', '자재 예약') + b('complete', '작업 완료');
          break;
        case 'settle':
          acts = j.invoice ? b('payment', '수금 기록', 'primary') : b('invoice', '청구서 발행', 'primary');
          break;
      }
    }
    const warn = mine.map((f) => findingRow(f, { noJob: true })).join('');
    return `<section class="now" aria-labelledby="now-h">
      <div><h2 id="now-h">지금 할 일</h2><p class="hint">${esc(hint)}</p></div>
      ${warn ? `<div>${warn}</div>` : j.status === 'open' ? '<div class="done-note">' + I.check + '이 작업에는 열린 경고가 없습니다</div>' : ''}
      ${acts ? `<div class="btns">${acts}</div>` : ''}
    </section>`;
  }
  function secSurvey(j) {
    const sv = j.survey;
    if (!sv) return '';
    return `<section class="panel"><div class="panel-h"><h2>현장 확인</h2>${sv.doneAt ? `<span class="pill ok">${dt(sv.doneAt)} 기록</span>` : '<span class="pill water">방문 예정</span>'}</div>
      <div class="panel-b"><dl class="kv">${sv.crewId ? `<dt>방문</dt><dd>${esc(crew(sv.crewId).name)} · ${E.md(sv.date)} ${sv.start || ''}${sv.end ? '~' + sv.end : ''}</dd>` : ''}${sv.findings ? `<dt>확인 결과</dt><dd>${esc(sv.findings)}</dd>` : ''}</dl></div></section>`;
  }
  function itemsTable(items, foot) {
    const t = E.totals(items);
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>항목</th><th class="n">수량</th><th class="n up">단가</th><th class="n">금액</th></tr></thead><tbody>${items
      .map((it) => `<tr><td>${esc(it.name)}</td><td class="n">${fq(it.qty)}${esc(it.unit)}</td><td class="n up">${won(it.unitPrice)}</td><td class="n">${won(E.lineAmount(it))}</td></tr>`)
      .join('')}</tbody><tfoot><tr><td colspan="3">공급가</td><td class="n">${won(t.supply)}</td></tr><tr><td colspan="3">부가세 10%</td><td class="n">${won(t.vat)}</td></tr><tr class="total"><td colspan="3">${foot || '합계'}</td><td class="n">${won(t.total)}</td></tr></tfoot></table></div>`;
  }
  function secQuote(j) {
    if (E.STAGE_INDEX[j.stage] < 2 && !j.quote.items.length) return '';
    const st = j.quote.sentAt ? `<span class="pill ${j.approval ? 'ok' : 'water'}">${j.approval ? '승인됨' : '발송 ' + dt(j.quote.sentAt) + ' · ' + esc(j.quote.sentVia)}</span>` : '<span class="pill">작성 중</span>';
    return `<section class="panel"><div class="panel-h"><h2>견적</h2>${st}</div><div class="panel-b">${j.quote.items.length ? itemsTable(j.quote.items, '견적 합계') : '<p class="muted">아직 항목이 없습니다</p>'}</div></section>`;
  }
  function secApproval(j) {
    const a = j.approval;
    if (!a) return '';
    return `<section class="panel"><div class="panel-h"><h2>고객 승인</h2><span class="pill ok">${esc(a.method)}</span></div><div class="panel-b"><dl class="kv"><dt>승인</dt><dd>${esc(a.by)} · ${dt(a.at)}</dd><dt>승인 금액</dt><dd class="tnum">${won(a.amount)}</dd>${a.signature ? `<dt>서명</dt><dd><img class="sig-img" src="${a.signature}" alt="${esc(a.by)} 서명"></dd>` : ''}</dl></div></section>`;
  }
  function secSchedule(j, F) {
    if (!j.assignments.length && j.stage !== 'schedule') return '';
    const flagged = flagMap(F.open);
    const rows = j.assignments
      .slice()
      .sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start))
      .map((a) => {
        const fl = flagged[a.id];
        const past = a.date < TODAY;
        return `<tr class="${fl === 'conflict' ? 'critrow' : fl === 'tight' ? 'warnrow' : ''}"><td>${esc(crew(a.crewId).name)}</td><td class="tnum">${E.md(a.date)} ${a.start}~${a.end}</td><td>${fl === 'conflict' ? '<span class="pill crit">다른 일정과 겹침</span>' : fl === 'tight' ? '<span class="pill warn">이동 시간 부족</span>' : past ? '<span class="muted">지난 일정</span>' : '<span class="pill ok">확정</span>'}</td><td class="n">${j.status === 'open' && j.stage === 'work' && !past ? `<button type="button" class="btn sm" data-act="slot" data-job="${j.id}" data-entry="${a.id}">옮기기</button>` : ''}</td></tr>`;
      })
      .join('');
    return `<section class="panel"><div class="panel-h"><h2>작업 배정</h2>${j.status === 'open' && (j.stage === 'schedule' || j.stage === 'work') ? `<button type="button" class="btn sm" data-act="assign" data-job="${j.id}">${I.plus}배정 추가</button>` : ''}</div>
      <div class="panel-b">${rows ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>팀</th><th>일시</th><th>상태</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="muted">아직 배정하지 않았습니다</p>'}</div></section>`;
  }
  function secMaterials(j) {
    const res = S.reservations.filter((r) => r.jobId === j.id && r.status !== 'canceled');
    const quoteQ = {};
    for (const it of j.quote.items) if (it.materialId) quoteQ[it.materialId] = (quoteQ[it.materialId] || 0) + it.qty;
    const coQ = {};
    for (const co of j.changeOrders) if (co.status !== 'rejected') for (const it of co.items) if (it.materialId) coQ[it.materialId] = (coQ[it.materialId] || 0) + it.qty;
    const used = E.usedBy(j);
    const mids = [...new Set([...Object.keys(quoteQ), ...Object.keys(coQ), ...Object.keys(used), ...res.map((r) => r.materialId)])];
    if (!mids.length || E.STAGE_INDEX[j.stage] < 4) return '';
    const ledger = Object.fromEntries(E.materialLedger(S).map((L) => [L.material.id, L]));
    const rows = mids
      .map((mid) => {
        const m = mat(mid);
        const active = res.filter((r) => r.materialId === mid && r.status === 'reserved');
        const resQ = active.reduce((a, r) => a + r.qty, 0);
        const short = (ledger[mid] ? ledger[mid].rows : []).filter((r) => r.jobId === j.id).reduce((a, r) => a + r.shortage, 0);
        const allowed = (quoteQ[mid] || 0) + (coQ[mid] || 0);
        const u = used[mid] || 0;
        const over = E.r2(u - allowed);
        let st = '<span class="muted">-</span>';
        if (over > 0) st = `<span class="pill crit">${fq(over)}${m.unit} 초과 사용</span>`;
        else if (short > 0) st = `<span class="pill crit">예약 ${fq(short)}${m.unit} 재고 부족</span>`;
        else if (active.length > 1) st = '<span class="pill warn">이중 예약</span>';
        else if (u >= allowed && allowed > 0) st = '<span class="pill ok">사용 완료</span>';
        else if (resQ > 0) st = '<span class="pill water">예약됨</span>';
        return `<tr class="${over > 0 || short > 0 ? 'critrow' : active.length > 1 ? 'warnrow' : ''}"><td>${esc(m.name)}</td><td class="n">${quoteQ[mid] ? fq(quoteQ[mid]) : '-'}</td><td class="n">${coQ[mid] ? fq(coQ[mid]) : '-'}</td><td class="n">${resQ ? fq(resQ) : '-'}</td><td class="n">${u ? fq(u) : '-'}</td><td class="muted">${m.unit}</td><td>${st}</td></tr>`;
      })
      .join('');
    const resList = res
      .filter((r) => r.status === 'reserved')
      .map((r) => {
        const m = mat(r.materialId);
        return `<li style="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:4px 0"><span>${esc(m.name)} ${fq(r.qty)}${m.unit} · ${E.md(r.date)}</span><button type="button" class="btn sm ghost" data-act="cancelRes" data-res="${r.id}">예약 취소</button></li>`;
      })
      .join('');
    const canAct = j.status === 'open' && ['schedule', 'work'].includes(j.stage);
    return `<section class="panel"><div class="panel-h"><h2>자재</h2>${canAct ? `<div class="btns">${j.stage === 'work' ? `<button type="button" class="btn sm" data-act="use" data-job="${j.id}">사용 기록</button>` : ''}<button type="button" class="btn sm" data-act="reserve" data-job="${j.id}">예약</button></div>` : ''}</div>
      <div class="panel-b"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>자재</th><th class="n">견적</th><th class="n">추가</th><th class="n">예약</th><th class="n">사용</th><th>단위</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${resList ? `<h3 style="font-size:13px;color:var(--ink-2);margin:14px 0 4px">걸려 있는 예약</h3><ul style="list-style:none;margin:0;padding:0">${resList}</ul>` : ''}</div></section>`;
  }
  function secCO(j) {
    if (!j.changeOrders.length && E.STAGE_INDEX[j.stage] < 4) return '';
    const list = j.changeOrders
      .map((co) => {
        const t = E.totals(co.items);
        const st = co.status === 'approved' ? `<span class="pill ok">승인 · ${esc(co.approval.method)} ${esc(co.approval.by)}</span>` : co.status === 'rejected' ? '<span class="pill">거절</span>' : '<span class="pill warn">승인 대기</span>';
        const pf = co.performed ? `<span class="pill ${co.status === 'approved' ? 'water' : 'crit'}">${co.status === 'approved' ? '시공함' : '승인 전 시공'}</span>` : '';
        const btns = [];
        if (co.status !== 'approved' && j.status !== 'canceled') btns.push(`<button type="button" class="btn sm primary" data-act="approveCO" data-job="${j.id}" data-co="${co.id}">고객 승인 받기</button>`);
        if (co.status === 'pending') btns.push(`<button type="button" class="btn sm" data-act="rejectCO" data-job="${j.id}" data-co="${co.id}">거절 기록</button>`);
        if (!co.performed && co.status !== 'rejected' && j.stage === 'work' && j.status === 'open') btns.push(`<button type="button" class="btn sm ghost" data-act="performCO" data-job="${j.id}" data-co="${co.id}">시공함 표시</button>`);
        return `<div class="co"><div class="co-h"><b>${esc(co.title)}</b><span class="btns">${st}${pf}</span></div>
          <ul>${co.items.map((it) => `<li>${esc(it.name)} ${fq(it.qty)}${esc(it.unit)} · ${won(E.lineAmount(it))}</li>`).join('')}</ul>
          <div class="co-h"><span class="tnum">합계 <b>${won(t.total)}</b> <span class="muted">(부가세 포함) · 요청 ${dt(co.requestedAt)}</span></span>${co.approval && co.approval.signature ? `<img class="sig-img" style="max-width:140px" src="${co.approval.signature}" alt="${esc(co.approval.by)} 서명">` : ''}</div>
          ${btns.length ? `<div class="btns">${btns.join('')}</div>` : ''}</div>`;
      })
      .join('');
    const canAdd = j.status === 'open' && ['schedule', 'work'].includes(j.stage);
    return `<section class="panel"><div class="panel-h"><h2>추가 작업</h2>${canAdd ? `<button type="button" class="btn sm" data-act="co" data-job="${j.id}">${I.plus}추가 작업 등록</button>` : ''}</div>
      <div class="panel-b">${list || '<p class="muted">현장에서 견적에 없던 작업이 생기면 여기에 등록하고 고객 승인을 받습니다</p>'}</div></section>`;
  }
  function secSettle(j) {
    if (j.stage !== 'settle') return '';
    if (!j.invoice) {
      const t = E.expectedTotal(j);
      return `<section class="panel"><div class="panel-h"><h2>정산</h2><span class="pill warn">청구서 미발행</span></div><div class="panel-b"><p>견적과 승인된 추가 작업 합계 <b class="tnum">${won(t)}</b> (부가세 포함)를 청구할 차례입니다. 완료 ${dt(j.completedAt)}</p></div></section>`;
    }
    const inv = j.invoice;
    const it = E.invoiceTotals(j);
    const pays = inv.payments.map((p) => `<li class="tnum">${dt(p.at)} · ${esc(p.method)} · ${won(p.amount)}</li>`).join('');
    return `<section class="panel"><div class="panel-h"><h2>정산 · ${esc(inv.no)}</h2>${it.balance === 0 ? '<span class="pill ok">완납</span>' : inv.dueDate < TODAY ? `<span class="pill crit">기한 ${E.diffDays(TODAY, inv.dueDate)}일 경과</span>` : `<span class="pill water">기한 ${E.md(inv.dueDate)}</span>`}</div>
      <div class="panel-b">${itemsTable(inv.lines, '청구 합계')}
      <dl class="kv" style="margin-top:12px"><dt>발행</dt><dd>${dt(inv.issuedAt)}</dd><dt>수금</dt><dd>${pays ? `<ul style="margin:0;padding-left:18px">${pays}</ul>` : '아직 없음'}</dd><dt>잔액</dt><dd class="tnum"><b>${won(it.balance)}</b></dd></dl>
      ${it.balance > 0 ? `<div class="btns" style="margin-top:12px"><button type="button" class="btn sm" data-act="payment" data-job="${j.id}">수금 기록</button></div>` : ''}</div></section>`;
  }

  /* ───────── 화면: 일정 ───────── */
  function weekStart(offset) {
    const d = E.dow(TODAY);
    const mon = E.addDays(TODAY, d === 0 ? -6 : 1 - d);
    return E.addDays(mon, offset * 7);
  }
  function viewSchedule() {
    const F = findings();
    const flagged = flagMap(F.open);
    const start = weekStart(ui.weekOffset);
    const days = Array.from({ length: 7 }, (_, i) => E.addDays(start, i));
    const entries = E.scheduleEntries(S).filter((e) => job(e.jobId).status !== 'canceled' && e.date >= days[0] && e.date <= days[6]);
    const conflicts = F.open.filter((f) => f.cat === 'schedule');
    const blk = (e) => {
      const j = job(e.jobId);
      const fl = flagged[e.id];
      return `<a class="blk ${e.kind === 'survey' ? 'survey' : ''} ${fl || ''}" href="#job-${j.id}"><span class="t">${e.start}–${e.end}</span>${fl ? `<span class="flag">${fl === 'conflict' ? '겹침' : '이동 촉박'}</span>` : ''}<span class="w">${e.kind === 'survey' ? '현장 확인 · ' : ''}${esc(j.title)}</span></a>`;
    };
    let grid = '<div class="corner"></div>' + days.map((d) => `<div class="hd ${d === TODAY ? 'today' : ''}"><span>${E.md(d)}</span></div>`).join('');
    for (const c of S.crews) {
      grid += `<div class="crew">${esc(c.name)}<small>${esc(c.members.join('·'))}</small></div>`;
      for (const d of days) {
        const list = entries.filter((e) => e.crewId === c.id && e.date === d).sort((a, b) => E.toMin(a.start) - E.toMin(b.start));
        grid += `<div class="cell ${d === TODAY ? 'today' : ''}">${list.map(blk).join('')}</div>`;
      }
    }
    if (!days.includes(ui.day)) ui.day = days.includes(TODAY) ? TODAY : days[0];
    const dayChips = days
      .map((d) => {
        const has = entries.some((e) => e.date === d && flagged[e.id] === 'conflict');
        return `<button type="button" class="chip" data-act="day" data-v="${d}" aria-pressed="${ui.day === d}">${WEEK[E.dow(d)]}<small>${Number(d.slice(8))}일</small>${has ? '<span class="dot" title="겹침 있음"></span>' : ''}</button>`;
      })
      .join('');
    const dayList = S.crews
      .map((c) => {
        const list = entries.filter((e) => e.crewId === c.id && e.date === ui.day).sort((a, b) => E.toMin(a.start) - E.toMin(b.start));
        return `<div class="agenda-crew"><h3>${esc(c.name)}</h3>${list.length ? list.map((e) => slotRow(e, flagged)).join('') : '<p class="muted" style="font-size:13px;padding:2px 10px">일정 없음</p>'}</div>`;
      })
      .join('');
    return `
      <header class="ph"><div><h1>일정</h1><p>${E.md(days[0])} – ${E.md(days[6])} · 겹침과 이동 시간 부족을 바로 표시합니다</p></div>
        <div class="ph-act"><button type="button" class="btn" data-act="week" data-v="-1" aria-label="이전 주">${I.left}</button><button type="button" class="btn" data-act="week" data-v="0">이번 주</button><button type="button" class="btn" data-act="week" data-v="1" aria-label="다음 주">${I.right}</button></div></header>
      ${conflicts.length ? `<section class="panel" style="margin-bottom:16px"><div class="panel-h"><h2>일정 경고 ${conflicts.length}건</h2></div><div class="panel-b flush">${conflicts.map((f) => findingRow(f)).join('')}</div></section>` : ''}
      <section class="panel">
        <div class="wk-wrap"><div class="wk">${grid}</div></div>
        <div class="daylist panel-b"><div class="days">${dayChips}</div><div class="agenda">${dayList}</div></div>
        <div class="legend"><span><i></i>시공</span><span><i class="s"></i>현장 확인 방문</span><span><i class="c"></i>시간 겹침</span><span><i class="w"></i>이동 ${S.settings.travelMin}분 미만</span></div>
      </section>`;
  }

  /* ───────── 화면: 자재 ───────── */
  function viewMaterials() {
    const ledger = E.materialLedger(S);
    const F = findings();
    const matF = F.open.filter((f) => f.cat === 'material');
    const resRows = (L) =>
      L.rows
        .map((r) => {
          const j = job(r.jobId);
          return `<tr class="sub-row ${r.id === ui.hiRes ? 'critrow' : ''}"><td style="padding-left:28px"><a href="#job-${j.id}">${esc(j.code)} ${esc(j.title)}</a></td><td class="n">${E.md(r.date)}</td><td class="n">${fq(r.qty)}</td><td class="n">${fq(r.cum)}</td><td colspan="2">${r.shortage > 0 ? `<span class="pill crit">${fq(r.shortage)}${L.material.unit} 부족</span>` : '<span class="pill ok">확보</span>'}</td><td class="n"><button type="button" class="btn sm ghost" data-act="cancelRes" data-res="${r.id}">예약 취소</button></td></tr>`;
        })
        .join('');
    const rows = ledger
      .map((L) => {
        const m = L.material;
        const short = L.rows.reduce((a, r) => a + r.shortage, 0);
        const pct = m.stock > 0 ? Math.min(100, (L.reserved / m.stock) * 100) : L.reserved > 0 ? 100 : 0;
        const open = ui.openMat === m.id;
        return `<tr class="mat-row ${open ? 'open' : ''}" data-act="toggleMat" data-v="${m.id}"><td><button type="button" class="rowbtn" aria-expanded="${open}">${esc(m.name)}</button></td><td class="n">${fq(m.stock)}</td><td class="n">${fq(L.reserved)}</td><td class="n" style="${L.available < 0 ? 'color:var(--crit);font-weight:700' : ''}">${fq(L.available)}</td><td class="muted">${esc(m.unit)}</td><td><span class="stockbar ${short > 0 ? 'over' : ''}" title="재고 대비 예약 ${Math.round(pct)}%"><i style="width:${pct}%"></i></span> ${short > 0 ? `<span class="pill crit">${fq(short)}${m.unit} 부족</span>` : L.rows.length ? `<span class="muted" style="font-size:12.5px">예약 ${L.rows.length}건</span>` : ''}</td><td class="n"><button type="button" class="btn sm" data-act="restock" data-v="${m.id}">입고</button></td></tr>${open ? (L.rows.length ? `<tr class="sub-row"><td style="padding-left:28px;font-weight:600">작업</td><td class="n">사용일</td><td class="n">수량</td><td class="n">누계</td><td colspan="3"></td></tr>` + resRows(L) : '<tr class="sub-row"><td colspan="7" style="padding-left:28px">걸린 예약이 없습니다</td></tr>') : ''}`;
      })
      .join('');
    const cards = ledger
      .map((L) => {
        const m = L.material;
        const short = L.rows.reduce((a, r) => a + r.shortage, 0);
        return `<div class="mcard"><div class="top"><b>${esc(m.name)}</b>${short > 0 ? `<span class="pill crit">${fq(short)}${m.unit} 부족</span>` : ''}</div>
          <div class="nums"><span>재고<b>${fq(m.stock)}${m.unit}</b></span><span>예약<b>${fq(L.reserved)}</b></span><span>가용<b style="${L.available < 0 ? 'color:var(--crit)' : ''}">${fq(L.available)}</b></span></div>
          ${L.rows.length ? `<div class="res">${L.rows.map((r) => `<span>${E.md(r.date)} · <a href="#job-${r.jobId}">${esc(job(r.jobId).title)}</a> ${fq(r.qty)}${m.unit}${r.shortage > 0 ? ` <b style="color:var(--crit)">${fq(r.shortage)} 부족</b>` : ''}</span>`).join('')}</div>` : ''}
          <div class="btns"><button type="button" class="btn sm" data-act="restock" data-v="${m.id}">입고</button></div></div>`;
      })
      .join('');
    return `
      <header class="ph"><div><h1>자재</h1><p>재고 ${S.materials.length}종 · 예약은 사용일이 빠른 작업부터 재고를 배분합니다</p></div></header>
      ${matF.length ? `<section class="panel" style="margin-bottom:16px"><div class="panel-h"><h2>자재 경고 ${matF.length}건</h2></div><div class="panel-b flush">${matF.map((f) => findingRow(f)).join('')}</div></section>` : ''}
      <section class="panel">
        <div class="mtable tbl-wrap"><table class="tbl"><thead><tr><th>자재 (누르면 예약 내역)</th><th class="n">재고</th><th class="n">활성 예약</th><th class="n">가용</th><th>단위</th><th>예약 비율</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="mcards">${cards}</div>
      </section>`;
  }

  /* ───────── 화면: 누수 점검 ───────── */
  function viewAudit() {
    const F = findings();
    const sum = E.summarize(F.open);
    const sel = ui.auditCat;
    const list = sel === 'all' ? F.open : F.open.filter((f) => f.cat === sel);
    const acked = sel === 'all' ? F.acked : F.acked.filter((f) => f.cat === sel);
    const tab = (v, label, b) => `<button type="button" data-act="auditCat" data-v="${v}" aria-pressed="${sel === v}"><span class="n">${b.total}</span><span class="lb">${label}</span><span class="sv">${dropBadges(b)}</span></button>`;
    const allB = { total: sum.total, critical: sum.critical, warning: sum.total - sum.critical };
    return `
      <header class="ph"><div><h1>누수 점검</h1><p>추가 작업 승인, 자재 예약, 작업팀 일정, 청구를 매번 다시 검사합니다 · 기준일 ${E.md(TODAY)}</p></div></header>
      <div class="cat-tabs" role="group" aria-label="경고 분류">${tab('all', '전체 열린 경고', allB)}${E.CAT_ORDER.map((c) => tab(c, E.CATS[c].label, sum.byCat[c])).join('')}</div>
      <section class="panel" style="margin-bottom:16px"><div class="money-row" style="margin:0">
        ${moneyCell('승인 미확보', sum.money.unapproved, '고객 승인 없이 한 작업·자재 (A1~A3)', 'crit')}
        ${moneyCell('청구 누락', sum.money.unbilled, '청구서에 들어가지 않은 금액 (B1~B3)', 'crit')}
        ${moneyCell('기한 지난 미수', sum.money.overdue, '지급 기한이 지난 잔액 (B4)', 'warn')}
      </div></section>
      <section class="panel"><div class="panel-h"><h2>${sel === 'all' ? '열린 경고' : E.CATS[sel].label} ${list.length}건</h2><span class="aside">심각한 것부터</span></div>
        <div class="panel-b flush">${list.map((f) => findingRow(f)).join('') || '<p class="empty">이 분류에 열린 경고가 없습니다</p>'}</div>
        ${acked.length ? `<details class="more"><summary>확인 처리한 경고 ${acked.length}건</summary>${acked.map((f) => findingRow(f, { acked: true })).join('')}</details>` : ''}
      </section>
      <section class="panel" style="margin-top:16px"><details class="more"><summary>탐지 규칙 ${Object.keys(E.RULES).length}개 보기</summary>

  /* ───────── 상태 변경 ───────── */
  function commit(actions, okMsg) {
    let s = S;
    const results = [];
    try {
      for (const a of actions) {
        const r = E.apply(s, a, ctx());
        s = r.state;
        results.push(r.result);
      }
    } catch (e) {
      if (e && e.name === 'ActionError') return { ok: false, error: e };
      console.error(e);
      return { ok: false, error: { message: '처리하지 못했습니다: ' + (e && e.message) } };
    }
    S = s;
    save();
    closeSheet();
    render();
    if (okMsg) toast(typeof okMsg === 'function' ? okMsg(results) : okMsg);
    return { ok: true, results };
  }
  function commitDirect(action, okMsg) {
    const r = commit([action], okMsg);
    if (!r.ok) toast(r.error.message);
    return r;
  }

  /* ───────── 시트(대화상자) ───────── */

  const seg = (name, opts, val) => `<div class="seg" role="radiogroup">${opts.map(([v, l]) => `<label><input type="radio" name="${name}" value="${esc(v)}" ${v === val ? 'checked' : ''}><span>${esc(l)}</span></label>`).join('')}</div>`;

  /* 서명 패드 */
  const sigHTML = () => `<div class="sig"><canvas id="sig-c" aria-label="고객 서명란"></canvas><div class="sig-bar"><span>고객이 손가락이나 마우스로 서명합니다</span><button type="button" class="btn sm" id="sig-clear">지우기</button></div></div>`;
  function mountSig(form) {
    const c = form.querySelector('#sig-c');
    if (!c) return () => null;
    const g = c.getContext('2d');
    let drawn = false;
    let down = false;
    function size() {
      const r = c.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      c.width = Math.max(1, Math.round(r.width * dpr));
      c.height = Math.max(1, Math.round(r.height * dpr));
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.lineWidth = 2.4;
      g.lineCap = 'round';
      g.lineJoin = 'round';
      g.strokeStyle = getComputedStyle(c).color;
    }
    size();
    const pos = (e) => {
      const r = c.getBoundingClientRect();
      return [e.clientX - r.left, e.clientY - r.top];
    };
    c.addEventListener('pointerdown', (e) => {
      down = true;
      try {
        c.setPointerCapture(e.pointerId);
      } catch (_) {
        /* 일부 브라우저는 캡처를 거부 */
      }
      const [x, y] = pos(e);
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + 0.1, y + 0.1);
      g.stroke();
      drawn = true;
    });
    c.addEventListener('pointermove', (e) => {
      if (!down) return;
      const [x, y] = pos(e);
      g.lineTo(x, y);
      g.stroke();
    });
    const up = () => (down = false);
    c.addEventListener('pointerup', up);
    c.addEventListener('pointercancel', up);
    form.querySelector('#sig-clear').addEventListener('click', () => {
      g.clearRect(0, 0, c.width, c.height);
      drawn = false;
    });
    return () => (drawn ? c.toDataURL('image/png') : null);
  }

  /* 승인 입력 묶음 (견적 승인·추가 작업 승인 공용) */

  /* 견적·추가 작업 항목 편집기 */

      rows.innerHTML = items.length
        ? items
            .map(

            <button type="button" class="ic rm" data-rm="${i}" aria-label="${esc(it.name)} 빼기">${I.x}</button></div>`
            )
            .join('')
        : '<p class="muted" style="font-size:13px;padding:6px 0">아래에서 항목을 고르세요</p>';
      sum();
    };
    const sum = () => {
      const t = E.totals(items.filter((it) => it.qty > 0));
      tot.innerHTML = `<span>공급가 ${won(t.supply)}</span><span>부가세 ${won(t.vat)}</span><span>합계 <b>${won(t.total)}</b></span>`;
      if (onChange) onChange(items);
    };
    rows.addEventListener('input', (e) => {
      const row = e.target.closest('.ie-row');
      if (!row) return;
      const it = items[Number(row.dataset.i)];
      const f = e.target.dataset.f;
      it[f] = f === 'name' ? e.target.value : Number(e.target.value);

        items.push({ kind: 'labor', name: c.name, materialId: null, qty: 1, unit: c.unit, unitPrice: c.price });
      } else {
        const m = mat(v);
        items.push({ kind: 'material', name: m.name, materialId: m.id, qty: 1, unit: m.unit, unitPrice: m.price });
      }
      e.target.value = '';
      draw();
      const last = rows.querySelector('.ie-row:last-child input[data-f="qty"]');

    return () => items.map((it) => Object.assign({}, it));

  const ieHTML = () => `<div class="ie"><div class="ie-head" aria-hidden="true"><span>항목</span><span class="n">수량</span><span class="n">단가</span><span class="n">금액</span><span></span></div><div id="ie-rows"></div>
    <label class="fld"><span>항목 추가</span><select id="ie-pick"><option value="">고르세요</option><optgroup label="공임·서비스">${S.catalog.map((c) => `<option value="${c.id}">${esc(c.name)} · ${won(c.price)}/${esc(c.unit)}</option>`).join('')}</optgroup><optgroup label="자재">${S.materials.map((m) => `<option value="${m.id}">${esc(m.name)} · ${won(m.price)}/${esc(m.unit)}</option>`).join('')}</optgroup><option value="etc">직접 입력</option></select></label>
    <div class="ie-tot" id="ie-tot"></div></div>`;

  /* 일정 입력 + 실시간 겹침 미리보기 */
  function slotSheet({ title, j, entryId, init, submitLabel, makeAction, okMsg }) {
    const body = `<div class="box info"><span><b>${esc(j.title)}</b> · ${esc(j.address)}</span></div>
      ${fld('작업팀', sel('crewId', crewOpts(), init.crewId))}
      <div class="r3">${fld('날짜', inp('date', init.date, 'type="date"'))}${fld('시작', inp('start', init.start, 'type="time" step="600"'))}${fld('종료', inp('end', init.end, 'type="time" step="600"'))}</div>
      <div id="slot-pv"></div>`;
    openSheet({
      title,
      body,
      foot: cancelBtn + btn(submitLabel, 'primary', 'go'),
      onMount(form) {
        const pv = $('#slot-pv', form);
        const upd = () => {
          const fd = Object.fromEntries(new FormData(form).entries());
          if (!fd.date || !fd.start || !fd.end || E.toMin(fd.start) >= E.toMin(fd.end)) {
            setHTML(pv, '');
            return;
          }
          const chk = E.checkSlot(S, { crewId: fd.crewId, date: fd.date, start: fd.start, end: fd.end, address: j.address }, entryId);
          const day = E.scheduleEntries(S).filter((e) => e.crewId === fd.crewId && e.date === fd.date && e.id !== entryId && job(e.jobId).status === 'open');
          const dayTxt = day.length ? day.sort((a, b) => E.toMin(a.start) - E.toMin(b.start)).map((e) => `<li>${e.start}~${e.end} ${e.kind === 'survey' ? '현장 확인' : '시공'} · ${esc(job(e.jobId).title)}</li>`).join('') : '';
          if (chk.conflicts.length) {
            setHTML(pv, `<div class="box crit" data-pv="conflict"><b>${crew(fd.crewId).name} 일정과 ${chk.conflicts.length}건 겹칩니다</b><ul>${chk.conflicts.map((e) => `<li>${e.start}~${e.end} ${esc(job(e.jobId).title)}</li>`).join('')}</ul><span>다른 팀이나 시간을 고르세요. 꼭 이 시간이어야 하면 아래 버튼으로 기록할 수 있고, 누수 점검에 겹침 경고로 남습니다.</span><div class="btns"><button type="submit" class="btn sm crit" value="force">겹침을 알고 그대로 저장</button></div></div>`);
          } else if (chk.tight.length) {
            setHTML(pv, `<div class="box warn" data-pv="tight"><b>이동 시간이 ${Math.min(...chk.tight.map((t) => t.gap))}분뿐입니다 (기준 ${S.settings.travelMin}분)</b><ul>${chk.tight.map((e) => `<li>${e.start}~${e.end} ${esc(job(e.jobId).title)} · ${esc(e.address)}</li>`).join('')}</ul></div>`);
          } else {
            setHTML(pv, `<div class="box ok" data-pv="ok"><b>겹치는 일정이 없습니다</b>${dayTxt ? `<span>같은 날 ${crew(fd.crewId).name} 일정</span><ul>${dayTxt}</ul>` : `<span>${crew(fd.crewId).name}의 ${E.md(fd.date)} 첫 일정입니다</span>`}</div>`);
          }
        };
        form.addEventListener('input', upd);
        form.addEventListener('change', upd);
        upd();
      },
      onSubmit(fd, mode) {
        const r = commit([makeAction(fd, mode === 'force')], okMsg);
        if (!r.ok) {
          const c = r.error.data && r.error.data.conflicts;
          showErr(r.error.message, c && c.length ? `<ul>${c.map((e) => `<li>${e.start}~${e.end} ${esc(job(e.jobId).title)}</li>`).join('')}</ul>` : '');
        }
      },
    });
  }
  function suggestSlot(crewId, date, len = 120) {
    const busy = E.scheduleEntries(S).filter((e) => e.crewId === crewId && e.date === date && job(e.jobId).status === 'open');
    for (let m = 9 * 60; m + len <= 18 * 60; m += 30) {
      const s = { start: hm(m), end: hm(m + len) };
      if (!busy.some((e) => E.toMin(e.start) < m + len + S.settings.travelMin && m < E.toMin(e.end) + S.settings.travelMin)) return s;
    }
    return { start: '09:00', end: hm(9 * 60 + len) };
  }
  const hm = (m) => pad2(Math.floor(m / 60)) + ':' + pad2(m % 60);
