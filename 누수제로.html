        },
        onSubmit(fd) {
          const r = commit([{ type: 'completeWork', jobId: j.id, note: fd.note }], '작업을 완료했습니다 · 청구서를 발행하세요');
          if (!r.ok) showErr(r.error.message);
        },
      });
    },
    invoice(d) {
      const j = job(d.job);
      const exp = E.expectedLines(j);
      const extra = E.unquotedUsage(S, j);
      const pend = j.changeOrders.filter((c) => c.status === 'pending');
      openSheet({
        title: '청구서 발행',
        wide: true,
        body: `${pend.length ? `<div class="box warn"><b>결정 안 된 추가 작업 ${pend.length}건</b><span>${pend.map((c) => esc(c.title)).join(', ')} · 승인되면 청구서에 추가할 수 있습니다</span></div>` : ''}
          <fieldset class="fld"><legend>청구 항목</legend>
          ${exp.map((l) => `<label class="check"><input type="checkbox" name="k:${esc(l.key)}" value="1" checked data-amt="${E.lineAmount(l)}"><span>${esc(l.name)} ${fq(l.qty)}${esc(l.unit)} · ${won(E.lineAmount(l))}<small>${l.source === 'quote' ? '견적' : '승인된 추가 작업'}</small></span></label>`).join('')}
          ${extra.map((x) => `<label class="check"><input type="checkbox" name="x:${x.materialId}" value="${x.qty}" data-amt="${Math.round(x.qty * x.unitPrice)}"><span>${esc(x.name)} ${fq(x.qty)}${esc(x.unit)} · ${won(Math.round(x.qty * x.unitPrice))}<small>견적 밖 사용 · 고객 승인 기록 없음. 청구하려면 승인을 먼저 받는 것이 안전합니다</small></span></label>`).join('')}
          </fieldset>
          ${fld('지급 기한', sel('dueDays', [['7', '7일 뒤'], ['14', '14일 뒤'], ['30', '30일 뒤']], String(S.settings.paymentTermDays)))}
          <div class="ie-tot" id="inv-tot"></div>`,
        foot: cancelBtn + btn('청구서 발행', 'primary'),
        onMount(form) {
          const upd = () => {
            const supply = $$('input[type=checkbox]', form).reduce((a, c) => a + (c.checked ? Number(c.dataset.amt) : 0), 0);
            const t = { supply, vat: Math.floor(supply * 0.1) };
            $('#inv-tot', form).innerHTML = `<span>공급가 ${won(t.supply)}</span><span>부가세 ${won(t.vat)}</span><span>청구 합계 <b>${won(t.supply + t.vat)}</b></span>`;
          };
          form.addEventListener('change', upd);
          upd();
        },
        onSubmit(fd) {
          const keys = Object.keys(fd)
            .filter((k) => k.startsWith('k:'))
            .map((k) => k.slice(2));
          const ex = Object.keys(fd)
            .filter((k) => k.startsWith('x:'))
            .map((k) => ({ materialId: k.slice(2), qty: Number(fd[k]) }));
          const r = commit([{ type: 'issueInvoice', jobId: j.id, keys, extra: ex, dueDays: Number(fd.dueDays) }], '청구서를 발행했습니다');
          if (!r.ok) showErr(r.error.message);
        },
      });
    },
    payment(d) {
      const j = job(d.job);
      const it = E.invoiceTotals(j);
      openSheet({
        title: '수금 기록',
        body: `<p>청구 ${won(it.total)} · 받은 돈 ${won(it.paid)} · 잔액 <b class="tnum">${won(it.balance)}</b></p>
          <div class="r2">${fld('받은 금액', inp('amount', it.balance, 'type="number" inputmode="numeric" step="1000" min="0"'))}${fld('받은 날', inp('date', TODAY, 'type="date"'))}</div>
          ${fld('방법', seg('method', [['계좌이체', '계좌이체'], ['카드', '카드'], ['현금', '현금']], '계좌이체'))}`,
        foot: cancelBtn + btn('수금 기록', 'primary'),
        onSubmit(fd) {
          const r = commit([{ type: 'recordPayment', jobId: j.id, amount: fd.amount, method: fd.method, date: fd.date }], (res) => (res[0].balance === 0 ? '완납 · 정산을 마쳤습니다' : `수금을 기록했습니다 · 잔액 ${won(res[0].balance)}`));
          if (!r.ok) showErr(r.error.message);
        },
      });
    },
    restock(d) {
      const m = mat(d.v);
      openSheet({
        title: `${m.name} 입고`,
        body: `<p>현재 재고 ${fq(m.stock)}${esc(m.unit)}</p>${fld('입고 수량', inp('qty', '', `type="number" inputmode="decimal" step="1" min="0" placeholder="${esc(m.unit)}"`))}${fld('메모', inp('note', '자재상 입고', 'type="text"'))}`,
        foot: cancelBtn + btn('입고 기록', 'primary'),
        onSubmit(fd) {
          const r = commit([{ type: 'restock', materialId: m.id, qty: fd.qty, note: fd.note }], `${m.name} 입고를 기록했습니다`);
          if (!r.ok) showErr(r.error.message);
        },
      });
    },
    merge(ids) {
      const rs = ids.map((id) => E.byId(S.reservations, id));
      const m = mat(rs[0].materialId);
      const j = job(rs[0].jobId);
      openSheet({
        title: '이중 예약 합치기',
        body: `<p><b>${esc(j.title)}</b>에 ${esc(m.name)} 예약이 ${rs.length}건 있습니다.</p><ul>${rs.map((r) => `<li>${fq(r.qty)}${m.unit} · ${E.md(r.date)}</li>`).join('')}</ul>${fld('실제로 필요한 수량', inp('qty', Math.max(...rs.map((r) => r.qty)), 'type="number" inputmode="decimal" step="0.5" min="0"'), `견적 수량 ${fq(j.quote.items.filter((i) => i.materialId === m.id).reduce((a, i) => a + i.qty, 0))}${m.unit}`)}`,
        foot: cancelBtn + btn('1건으로 합치기', 'primary'),
        onSubmit(fd) {
          const r = commit([{ type: 'mergeReservations', ids, qty: fd.qty }], '예약을 1건으로 합쳤습니다');
          if (!r.ok) showErr(r.error.message);
        },
      });
    },
    ack(key) {
      const f = findings().all.find((x) => x.key === key);
      openSheet({
        title: '경고 확인 처리',
        body: `<p><b>${esc(f.title)}</b><br><span class="muted">${esc(f.detail)}</span></p>${fld('확인 메모', inp('note', '', 'type="text" placeholder="예: 같은 단지라 걸어서 이동"'), '확인 처리한 경고는 목록 아래 따로 모이고 언제든 다시 열 수 있습니다')}`,
        foot: cancelBtn + btn('확인 처리', 'primary'),
        onSubmit(fd) {
          const r = commit([{ type: 'ack', key, note: fd.note }], '확인 처리했습니다');
          if (!r.ok) showErr(r.error.message);
        },
      });
    },
    cancelJob(d) {
      const j = job(d.job);
      openSheet({
        title: '작업 취소',
        body: `<p><b>${esc(j.title)}</b>을(를) 취소합니다. 걸려 있는 자재 예약과 남은 배정이 풀립니다.</p>${fld('사유', inp('reason', '', 'type="text" placeholder="예: 고객 사정으로 보류"'))}`,
        foot: cancelBtn + btn('작업 취소', 'crit'),
        onSubmit(fd) {
          const r = commit([{ type: 'cancelJob', jobId: j.id, reason: fd.reason }], '작업을 취소했습니다');
          if (!r.ok) showErr(r.error.message);
        },
      });
    },
    menu() {
      openSheet({
        title: '더보기',
        body: `<div class="stack" style="gap:8px"><a class="btn" href="#tests">${I.flask}자가 테스트</a><button type="button" class="btn" id="m-reset">${I.reset}데이터 초기화</button><p class="muted" style="font-size:12.5px">예시 데이터로 시작했습니다. 입력한 내용은 이 브라우저에만 저장됩니다.</p></div>`,
        foot: cancelBtn,
        onMount(form) {
          $('#m-reset', form).addEventListener('click', () => SHEETS.reset());
          $('a[href="#tests"]', form).addEventListener('click', closeSheet);
        },
      });
    },
    reset() {
      openSheet({
        title: '데이터 초기화',
        body: '<p>지금까지 입력한 내용을 지우고 새로 시작합니다. 되돌릴 수 없습니다.</p>',
        foot: cancelBtn + btn('빈 장부로 시작', '', 'empty') + btn('예시 데이터로 다시 시작', 'crit', 'sample'),
        onSubmit(fd, mode) {
          S = mode === 'empty' ? E.starterState() : E.buildSampleState(TODAY);
          save();
          closeSheet();
          ui.tests = null;
          go('home');
          toast(mode === 'empty' ? '빈 장부로 시작합니다' : '예시 데이터로 다시 시작합니다');
        },
      });
    },
  };

  /* ───────── 클릭 처리 ───────── */
  const H = {
    newJob: () => SHEETS.newJob(),
    stage(d) {
      ui.stageFilter = ui.stageFilter === d.v && ui.view === 'jobs' && E.STAGE_INDEX[d.v] != null ? 'open' : d.v;
      go('jobs');
    },
    goAudit(d) {
      ui.auditCat = d.v;
      go('audit');
    },
    auditCat(d) {
      ui.auditCat = d.v;
      render();
    },
    week(d) {
      ui.weekOffset = d.v === '0' ? 0 : ui.weekOffset + Number(d.v);
      render();
    },
    day(d) {
      ui.day = d.v;
      render();
    },
    toggleMat(d) {
      ui.openMat = ui.openMat === d.v ? null : d.v;
      render();
    },
    restock: (d) => SHEETS.restock(d),
    runTests() {
      runTests();
      render();
      toast('테스트를 다시 실행했습니다');
    },
    menu: () => SHEETS.menu(),
    reset: () => SHEETS.reset(),
    ack: (d) => SHEETS.ack(d.key),
    unack: (d) => commitDirect({ type: 'unack', key: d.key }, '경고를 다시 열었습니다'),
    cancelRes: (d) => commitDirect({ type: 'cancelReservation', reservationId: d.res }, '예약을 취소했습니다'),
    rejectCO: (d) => commitDirect({ type: 'rejectChangeOrder', jobId: d.job, coId: d.co }, '거절을 기록했습니다'),
    performCO: (d) => commitDirect({ type: 'markPerformed', jobId: d.job, coId: d.co }, (res) => (res[0].unapproved ? '시공을 기록했습니다 · 승인 전 시공 경고가 열렸습니다' : '시공을 기록했습니다')),
    fix(d) {
      const f = findings().all.find((x) => x.key === d.key);
      if (!f) return toast('이미 해결된 경고입니다');
      const x = f.fix;
      switch (x.type) {
        case 'approveCO':
          return SHEETS.approveCO({ job: x.jobId, co: x.coId });
        case 'addCO':
          return SHEETS.co({ job: x.jobId }, { materialId: x.materialId, qty: x.qty });
        case 'issueInvoice':
          return SHEETS.invoice({ job: x.jobId });
        case 'addInvoiceLines':
          return commitDirect({ type: 'addInvoiceLines', jobId: x.jobId, keys: x.keys }, `청구서에 ${won(f.amount)}을 추가했습니다`);
        case 'addExtraLine':
          return commitDirect({ type: 'addInvoiceLines', jobId: x.jobId, extra: [{ materialId: x.materialId, qty: x.qty }] }, `청구서에 ${won(f.amount)}을 추가했습니다`);
        case 'payment':
          return SHEETS.payment({ job: x.jobId });
        case 'complete':
          return go('job-' + x.jobId);
        case 'material':
          ui.openMat = x.materialId;
          ui.hiRes = x.reservationId;
          return go('materials');
        case 'mergeReservations':
          return SHEETS.merge(x.ids);
        case 'reschedule':
          return SHEETS.slot({ job: x.jobId, entry: x.entryId });
      }
    },
  };
  for (const k of ['survey', 'surveyRecord', 'quote', 'sendQuote', 'approve', 'decline', 'assign', 'slot', 'reserve', 'use', 'co', 'approveCO', 'complete', 'invoice', 'payment', 'cancelJob']) H[k] = (d) => SHEETS[k](d);

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el || el.closest('#sheet-root .sh-body [data-act="approveCO"]')) return;
    const h = H[el.dataset.act];
    if (!h) return;
    ev.preventDefault();
    h(el.dataset, el, ev);
  });

  /* ───────── 시작 ───────── */
  $('#side-today').textContent = longDate(TODAY);
  Object.assign(ui, parseHash());
  render();
  window.__nusu = { get state() { return S; }, E, today: TODAY };
})();

</script>

</body></html>
